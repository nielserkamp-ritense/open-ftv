{{/* PostgreSQL is always needed: the PDP writes the authorization decision log to it, and the
     manager also has its own database. The subcharts can't include this chart's helpers, so the
     cluster is always named <release>-postgresql: the secret names in values.yaml rely on it. */}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "open-ftv.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: open-ftv
      app.kubernetes.io/component: database
  instances: {{ .Values.postgresql.instances }}
  storage:
    size: {{ .Values.postgresql.storageSize }}
  bootstrap:
    initdb:
      owner: {{ .Values.postgresql.databaseOwner }}
  monitoring:
    disableDefaultQueries: true
  enablePDB: {{ gt .Values.postgresql.instances 1.0 }}

{{/* The authorization decision log, written by the PDP and read by the manager. */}}
{{- with .Values.pdp.config.authorizationDecisionLog.postgresql.database }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Release.Name }}-adl
  labels:
    {{- include "open-ftv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ $.Release.Name }}-postgresql
  name: {{ . }}
  owner: {{ $.Values.postgresql.databaseOwner }}
  databaseReclaimPolicy: {{ $.Values.postgresql.databaseReclaimPolicy }}
{{- end }}

{{/* The manager's own database: policies, attributes, entities and settings. */}}
{{- if .Values.manager.enabled }}
{{- with .Values.manager.config.database.database }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Release.Name }}-manager
  labels:
    {{- include "open-ftv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ $.Release.Name }}-postgresql
  name: {{ . }}
  owner: {{ $.Values.postgresql.databaseOwner }}
  databaseReclaimPolicy: {{ $.Values.postgresql.databaseReclaimPolicy }}
{{- end }}
{{- end }}
