{{- $fullname := include "open-ftv.fullname" . -}}
{{- $clusterName := include "open-ftv.postgresqlClusterName" . -}}
{{- $pdpNeedsPostgresql := eq .Values.pdp.config.authorizationDecisionLog.type "postgresql" -}}

{{/* The manager always needs PostgreSQL: its own database and the authorization decision log. */}}
{{- if or $pdpNeedsPostgresql .Values.manager.enabled -}}

{{- if not .Values.postgresql.existingCluster -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "open-ftv.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: open-ftv
      app.kubernetes.io/component: database
  instances: {{ .Values.postgresql.instances }}
  storage:
    size: {{ .Values.postgresql.storageSize }}
  bootstrap:
    initdb:
      owner: {{ .Values.postgresql.databaseOwner }}
  monitoring:
    disableDefaultQueries: true
  enablePDB: {{ gt .Values.postgresql.instances 1.0 }}
{{- end }}

{{/* The authorization decision log, shared by the PDP and the manager. */}}
{{- $adlDatabase := "" }}
{{- if $pdpNeedsPostgresql }}
{{- $adlDatabase = .Values.pdp.config.authorizationDecisionLog.postgresql.database }}
{{- else }}
{{- $adlDatabase = .Values.manager.config.authorizationDecisionLog.postgresql.database }}
{{- end }}
{{- with $adlDatabase }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $fullname }}-adl
  labels:
    {{- include "open-ftv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ $clusterName }}
  name: {{ . }}
  owner: {{ $.Values.postgresql.databaseOwner }}
  databaseReclaimPolicy: {{ $.Values.postgresql.databaseReclaimPolicy }}
{{- end }}

{{/* The manager's own database: policies, attributes, entities and settings. */}}
{{- if .Values.manager.enabled }}
{{- with .Values.manager.config.database.database }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $fullname }}-manager
  labels:
    {{- include "open-ftv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ $clusterName }}
  name: {{ . }}
  owner: {{ $.Values.postgresql.databaseOwner }}
  databaseReclaimPolicy: {{ $.Values.postgresql.databaseReclaimPolicy }}
{{- end }}
{{- end }}
{{- end }}
