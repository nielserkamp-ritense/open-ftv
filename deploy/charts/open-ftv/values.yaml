nameOverride: ""

postgresql:
  # The cluster is named <release>-postgresql; the existingSecret names below are its app secret.
  instances: 1
  storageSize: 1Gi
  databaseOwner: app
  databaseReclaimPolicy: delete

pdp:
  nameOverride: pdp
  config:
    policySource: local
    # policyLanguage: ""
    authorizationDecisionLog: &authorizationDecisionLog
      postgresql:
        database: openftv_adl
        existingSecret:
          name: "{{ .Release.Name }}-postgresql-app"

manager:
  enabled: false
  nameOverride: manager
  fullnameOverride: "{{ .Release.Name }}-manager"
  config:
    database:
      database: openftv
      existingSecret:
        name: "{{ .Release.Name }}-postgresql-app"
    authorizationDecisionLog: *authorizationDecisionLog

management-interface:
  enabled: false
  nameOverride: management-interface
  # The manager's Service, named by manager.fullnameOverride.
  ingress:
    managerServiceName: "{{ .Release.Name }}-manager"
  httpRoute:
    managerServiceName: "{{ .Release.Name }}-manager"

keycloak:
  enabled: false
  nameOverride: keycloak
