{{- if and (eq .Values.config.policySource "local") .Values.config.policyEntities -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-ftv-pdp.fullname" . }}-policy-entities
  labels:
    {{- include "open-ftv-pdp.labels" . | nindent 4 }}
data:
{{- range $name, $content := .Values.config.policyEntities }}
{{- if kindIs "string" $content }}
  {{ $name }}: |-
    {{- $content | nindent 4 }}
{{- else }}
  {{ $name }}.yaml: |-
    {{- toYaml $content | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
