image:
  repository: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/pdp
  # tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

config:
  tls:
    enabled: false
    # existingSecret: ""
  logFormat: json
  logLevel: info

  # local: policies from this chart's ConfigMaps. manager: the PDP pulls its bundle from
  # bundleManager.url at start, and the manager pushes updates to the internal port.
  policySource: "local"
  policyLanguage: "cedar"
  bundleManager:
    # e.g. http://{{ .Release.Name }}-manager:9090/v1/bundle/pdp1
    url: ""
  policies: {}
  #   filename.ext: |-
  #     ""
  # policiesExistingConfigMap: ""
  policyAttributes: {}
  policyEntities: {}

  pipPullConfig: {}

  requestMappings: []

  # The authorization decision log. The PDP requires PostgreSQL for it and migrates
  # the database itself at startup.
  authorizationDecisionLog:
    serviceName: openftv-pdp
    postgresql:
      # hostname: ""
      # database: ""
      existingSecret:
        # The `<cluster>-app` secret CloudNativePG creates for the cluster's application user.
        name: open-ftv-postgresql-app
        hostnameKey: host
        databaseKey: dbname
        usernameKey: username
        passwordKey: password

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

deploymentAnnotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  runAsUser: 65534

service:
  type: ClusterIP
  httpsPort: 443
  httpPort: 80
  internalPort: 9090

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
