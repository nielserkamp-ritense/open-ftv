apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-ftv-laadpalen-applicatie.fullname" . }}
  labels:
    {{- include "open-ftv-laadpalen-applicatie.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "open-ftv-laadpalen-applicatie.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
