apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-ftv-manager.fullname" . }}
  labels:
    {{- include "open-ftv-manager.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-ftv-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-ftv-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "open-ftv-manager.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MANAGER_HOST
              value: "0.0.0.0"
            - name: MANAGER_PORT
              value: "8080"
            - name: MANAGER_CORS_ORIGINS
              value: {{ include "open-ftv-manager.corsOrigins" . }}
            - name: MANAGER_CORS_HEADERS
              value: {{ join "," .Values.config.corsHeaders | quote }}
            - name: MANAGER_INTERNAL_PORT
              value: "9090"
            - name: MANAGER_HEALTH_PORT
              value: "8081"
            - name: MANAGER_LOG_TARGET
              value: stdout
            - name: MANAGER_LOG_FORMAT
              value: {{ .Values.config.logFormat }}
            - name: MANAGER_LOG_LEVEL
              value: {{ .Values.config.logLevel }}
            {{- include "open-ftv-manager.databasePostgresql" (dict "postgresql" .Values.config.database "root" $) | nindent 12 }}
            {{- $oidc := .Values.config.oidc }}
            {{- if $oidc.jwksUrl }}
            - name: MANAGER_OIDC_ISSUER
              value: {{ $oidc.issuer | quote }}
            - name: MANAGER_OIDC_JWKS_URL
              value: {{ tpl $oidc.jwksUrl . | quote }}
            - name: MANAGER_OIDC_AUDIENCE
              value: {{ $oidc.audience | quote }}
            - name: MANAGER_OIDC_ROLES_CLAIM
              value: {{ $oidc.rolesClaim | quote }}
            {{- end }}
            {{- include "open-ftv-manager.authorizationDecisionLogPostgresql" (dict "postgresql" .Values.config.authorizationDecisionLog.postgresql "root" $) | nindent 12 }}
            {{- if .Values.config.seedPoliciesExistingConfigMap }}
            - name: MANAGER_POLICIES_STORE
              value: /etc/open-ftv/manager/policies
            {{- end }}
            {{- if .Values.config.tagsExistingConfigMap }}
            - name: MANAGER_TAGS_PATH
              value: /etc/open-ftv/manager/tags
            {{- end }}
            {{- if .Values.config.bundlesExistingConfigMap }}
            - name: MANAGER_BUNDLE_CONFIGS
              value: /etc/open-ftv/manager/bundles
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $config := .Values.config }}
          {{- if or $config.seedPoliciesExistingConfigMap $config.tagsExistingConfigMap $config.bundlesExistingConfigMap }}
          volumeMounts:
            {{- with $config.seedPoliciesExistingConfigMap }}
            - name: policies
              mountPath: /etc/open-ftv/manager/policies
              readOnly: true
            {{- end }}
            {{- with $config.tagsExistingConfigMap }}
            - name: tags
              mountPath: /etc/open-ftv/manager/tags
              readOnly: true
            {{- end }}
            {{- with $config.bundlesExistingConfigMap }}
            - name: bundles
              mountPath: /etc/open-ftv/manager/bundles
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $config.seedPoliciesExistingConfigMap $config.tagsExistingConfigMap $config.bundlesExistingConfigMap }}
      volumes:
        {{- with $config.seedPoliciesExistingConfigMap }}
        - name: policies
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with $config.tagsExistingConfigMap }}
        - name: tags
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with $config.bundlesExistingConfigMap }}
        - name: bundles
          configMap:
            name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
