apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-ftv-manager.fullname" . }}
  labels:
    {{- include "open-ftv-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "open-ftv-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.config.bundlesExistingConfigMap }}
    # Where the PDPs pull their bundles; the manager only listens here with bundle configs.
    - name: internal
      protocol: TCP
      port: {{ .Values.service.internalPort }}
      targetPort: internal
    {{- end }}
