image:
  repository: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/manager
  # tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

config:
  logFormat: json
  logLevel: info

  # The manager's own database: policies, attributes, entities and settings.
  # Migrated by the manager itself at startup.
  database:
    # hostname: ""
    # database: ""
    # How the connection uses TLS: disable, allow, prefer, require, verify-ca or verify-full.
    sslMode: require
    existingSecret:
      # The `<cluster>-app` secret CloudNativePG creates for the cluster's application user.
      name: open-ftv-postgresql-app
      hostnameKey: host
      databaseKey: dbname
      usernameKey: username
      passwordKey: password

  # The authorization decision log written by the PDP, read by the manager. It MUST be a
  # different database from `config.database` above: both are migrated with golang-migrate,
  # which keeps its version in a `schema_migrations` table -- one database for both schemas
  # makes the two migration runs clobber each other's version.
  authorizationDecisionLog:
    postgresql:
      # hostname: ""
      database: openftv_adl
      sslMode: require
      existingSecret:
        name: open-ftv-postgresql-app
        hostnameKey: host
        databaseKey: dbname
        usernameKey: username
        passwordKey: password

  corsOrigins: []
  corsHeaders: []

  # Leave jwksUrl empty to run without token validation. It is the on/off
  # switch: empty means bearer tokens are not validated and yield no principal.
  # Independent of the bundled keycloak subchart -- point these at any provider.
  oidc:
    issuer: ""
    jwksUrl: ""
    audience: ""
    rolesClaim: roles

  # Existing ConfigMaps, one file per key, that the manager starts with. Leave a name empty
  # to go without. A key's extension decides whether it is read: .cedar or .rego (each with an
  # optional .meta) for policies, .yaml, .yml or .json for tags and bundle configurations.
  # Seed policies are stored once: a policy the store has seen before is never written again,
  # even after it was edited or deleted.
  seedPoliciesExistingConfigMap: ""
  tagsExistingConfigMap: ""
  # Which PDPs get which policies. PDPs pull their bundle from the internal port at start.
  bundlesExistingConfigMap: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

deploymentAnnotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  runAsUser: 65534

service:
  type: ClusterIP
  port: 80
  internalPort: 9090

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
