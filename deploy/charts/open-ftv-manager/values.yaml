image:
  repository: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/manager
  # tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

config:
  logFormat: json
  logLevel: info

  # The manager's own database: policies, attributes, entities and settings.
  # Migrated by the manager itself at startup.
  database:
    # hostname: ""
    # database: ""
    existingSecret:
      # The `<cluster>-app` secret CloudNativePG creates for the cluster's application user.
      name: open-ftv-postgresql-app
      hostnameKey: host
      databaseKey: dbname
      usernameKey: username
      passwordKey: password

  # The authorization decision log written by the PDP, read by the manager. It MUST be a
  # different database from `config.database` above: both are migrated with golang-migrate,
  # which keeps its version in a `schema_migrations` table -- one database for both schemas
  # makes the two migration runs clobber each other's version.
  authorizationDecisionLog:
    postgresql:
      # hostname: ""
      database: openftv_adl
      existingSecret:
        name: open-ftv-postgresql-app
        hostnameKey: host
        databaseKey: dbname
        usernameKey: username
        passwordKey: password

  corsOrigins: []
  corsHeaders: []

  # Leave jwksUrl empty to run without token validation. It is the on/off
  # switch: empty means bearer tokens are not validated and yield no principal.
  # Independent of the bundled keycloak subchart -- point these at any provider.
  oidc:
    issuer: ""
    jwksUrl: ""
    audience: ""
    rolesClaim: roles

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

deploymentAnnotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  runAsUser: 65534

service:
  type: ClusterIP
  port: 80

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
