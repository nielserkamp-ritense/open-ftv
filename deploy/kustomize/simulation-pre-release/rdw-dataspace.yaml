apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdw-dataspace
  labels:
    app.kubernetes.io/name: rdw-dataspace
    app.kubernetes.io/part-of: open-ftv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rdw-dataspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdw-dataspace
        app.kubernetes.io/part-of: open-ftv
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: rdw-dataspace
          image: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/mock-ds-rdw:v${OPEN_FTV_VERSION}
          env:
            - name: GEN_DS_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: rdw-dataspace
  labels:
    app.kubernetes.io/name: rdw-dataspace
    app.kubernetes.io/part-of: open-ftv
spec:
  selector:
    app.kubernetes.io/name: rdw-dataspace
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
