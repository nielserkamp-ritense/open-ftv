apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-ftv-vlierdam
spec:
  serviceAccountName: flux-reconciler
  interval: 35m
  chartRef:
    kind: OCIRepository
    name: open-ftv
  values:
    pdp:
      config:
        policySource: manager
        bundleManager:
          url: http://{{ .Release.Name }}-manager:9090/v1/bundle/pdp1
        authorizationDecisionLog:
          serviceName: vlierdam
        # From demo/gemeente-vlierdam/pdp1 (see kustomization.yaml).
        pipPullConfigExistingConfigMap: open-ftv-vlierdam-pdp1-pull-config
    manager:
      enabled: true
      config:
        corsOrigins:
          - https://openftv-vlierdam-beheer-pre.simulatie.datastelsel.nl
        oidc:
          issuer: https://openftv-vlierdam-keycloak-pre.simulatie.datastelsel.nl/realms/openftv
          jwksUrl: http://{{ .Release.Name }}-keycloak/realms/openftv/protocol/openid-connect/certs
          audience: openftv
        seedPoliciesExistingConfigMap: open-ftv-vlierdam-manager-policies
        tagsExistingConfigMap: open-ftv-vlierdam-manager-tags
        bundlesExistingConfigMap: open-ftv-vlierdam-manager-bundles
    management-interface:
      enabled: true
      config:
        oidc:
          authority: https://openftv-vlierdam-keycloak-pre.simulatie.datastelsel.nl/realms/openftv
          clientId: openftv
      httpRoute:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: default-gateway
            namespace: fds-public
            sectionName: https
        hostnames:
          - openftv-vlierdam-beheer-pre.simulatie.datastelsel.nl
    keycloak:
      enabled: true
      config:
        # Reach the admin console with: kubectl port-forward svc/open-ftv-vlierdam-keycloak 8080:80
        adminHostname: http://localhost:8080
        adminUsername: admin
        adminPassword: rS75MSriX685rzkUonPrZLxTsE39
        realm:
          redirectUris:
            - https://openftv-vlierdam-beheer-pre.simulatie.datastelsel.nl/*
          webOrigins:
            - https://openftv-vlierdam-beheer-pre.simulatie.datastelsel.nl
          users:
            adminPassword: password
            authorPassword: password
            auditorPassword: password
      httpRoute:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: default-gateway
            namespace: fds-public
            sectionName: https
        hostnames:
          - openftv-vlierdam-keycloak-pre.simulatie.datastelsel.nl
