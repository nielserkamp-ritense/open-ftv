# RvIG's inway in front of the BRP dataspace: checks the consumer's API key and asks RvIG's PDP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brp-inway
  labels:
    app.kubernetes.io/name: brp-inway
    app.kubernetes.io/part-of: open-ftv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brp-inway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brp-inway
        app.kubernetes.io/part-of: open-ftv
    spec:
      containers:
        - name: kong
          image: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/gw-kong:v${OPEN_FTV_VERSION}
          # The image's entrypoint is the OpenFTV plugin, which Kong starts itself.
          command:
            - /docker-entrypoint.sh
          args:
            - kong
            - docker-start
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/conf.yaml
            - name: KONG_PLUGINS
              value: openftv,bundled
            - name: KONG_PLUGINSERVER_NAMES
              value: openftv
            - name: KONG_PLUGINSERVER_OPENFTV_START_CMD
              value: /ko-app/openftv
            - name: KONG_PLUGINSERVER_OPENFTV_QUERY_CMD
              value: /ko-app/openftv -dump
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            # Kong's default starts a worker per CPU of the node, whatever the pod's limits.
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: status
              containerPort: 8100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
          livenessProbe:
            httpGet:
              path: /status
              port: status
          volumeMounts:
            - name: config
              mountPath: /etc/kong
              readOnly: true
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            # The image's user is kong, a name the kubelet can't check against runAsNonRoot.
            runAsUser: 1001
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: brp-inway-config
---
apiVersion: v1
kind: Service
metadata:
  name: brp-inway
  labels:
    app.kubernetes.io/name: brp-inway
    app.kubernetes.io/part-of: open-ftv
spec:
  selector:
    app.kubernetes.io/name: brp-inway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
