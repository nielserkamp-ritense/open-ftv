apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: laadpalen-applicatie
spec:
  serviceAccountName: flux-reconciler
  interval: 35m
  chartRef:
    kind: OCIRepository
    name: open-ftv-laadpalen-applicatie
  values:
    fullnameOverride: laadpalen-applicatie
    config:
      apiBaseURL: https://openftv-vlierdam-pre.simulatie.datastelsel.nl/dataspace
      vlierdamOutwayURL: https://openftv-vlierdam-pre.simulatie.datastelsel.nl/outway
      vlierdamPdp1URL: https://openftv-vlierdam-pre.simulatie.datastelsel.nl/pdp1
      beheerURL: https://openftv-vlierdam-beheer-pre.simulatie.datastelsel.nl
      rvigBeheerURL: https://openftv-brp-beheer-pre.simulatie.datastelsel.nl
      rdwBeheerURL: https://openftv-rdw-beheer-pre.simulatie.datastelsel.nl
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-gateway
          namespace: fds-public
          sectionName: https
      hostnames:
        - openftv-vlierdam-pre.simulatie.datastelsel.nl
---
# The app calls these from the browser. Serving them from the app's own host avoids CORS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: laadpalen-applicatie-backends
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
      namespace: fds-public
      sectionName: https
  hostnames:
    - openftv-vlierdam-pre.simulatie.datastelsel.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dataspace
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - kind: Service
          name: vlierdam-dataspace
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /outway
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - kind: Service
          name: vlierdam-outway
          port: 80
    # Only the evaluation endpoint, for the aanvraag form's scenario 1 check.
    - matches:
        - path:
            type: Exact
            value: /pdp1/authzen/v1/evaluation
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /authzen/v1/evaluation
      backendRefs:
        - kind: Service
          name: open-ftv-vlierdam-pdp
          port: 80
