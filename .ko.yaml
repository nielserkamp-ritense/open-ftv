defaultBaseImage: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
defaultPlatforms:
  - linux/amd64
  - linux/arm64
defaultEnv:
  - CGO_ENABLED=0
defaultLdflags:
  - -s -w

builds:
  - id: pip
    main: ./apps/pip/cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pip/config.GitTag={{.Env.GIT_TAG_NAME}}
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pip/config.GitHash={{.Env.GIT_COMMIT_HASH}}

  - id: pap
    main: ./apps/pap/cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pap/config.GitTag={{.Env.GIT_TAG_NAME}}
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pap/config.GitHash={{.Env.GIT_COMMIT_HASH}}

  - id: pdp
    main: ./apps/pdp/cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pdp/config.GitTag={{.Env.GIT_TAG_NAME}}
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/pdp/config.GitHash={{.Env.GIT_COMMIT_HASH}}

  - id: manager
    main: ./apps/manager/cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/manager/config.GitTag={{.Env.GIT_TAG_NAME}}
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/manager/config.GitHash={{.Env.GIT_COMMIT_HASH}}

  - id: management-interface
    main: ./apps/management-interface/cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/management-interface/config.GitTag={{.Env.GIT_TAG_NAME}}
      - -X gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/apps/management-interface/config.GitHash={{.Env.GIT_COMMIT_HASH}}
