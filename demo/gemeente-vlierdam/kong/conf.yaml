_transform: false
_format_version: '3.0'

services:
- id: a28e5042-f33d-44a7-8673-6b082a930a7d
  name: OpenFTV-RvIG-Inway
  enabled: true
  host: rvig-api-gateway
  port: 8000
  protocol: http
  retries: 5
  connect_timeout: 60000
  write_timeout: 60000
  read_timeout: 60000

- id: 73d5bfc1-cb75-44ac-8e66-5c4e18f8de71
  name: OpenFTV-RDW-inway
  enabled: true
  host: rdw-api-gateway
  port: 8000
  protocol: http
  retries: 5
  connect_timeout: 60000
  write_timeout: 60000
  read_timeout: 60000

routes:
- id: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  service: a28e5042-f33d-44a7-8673-6b082a930a7d
  name: OpenFTV-RvIG-BRP-personen
  regex_priority: 0
  path_handling: v0
  preserve_host: false
  https_redirect_status_code: 426
  strip_path: false
  request_buffering: true
  response_buffering: true
  methods: ~
  paths:
    - /v1/haalcentraal/api/brp/personen
    - /v1/meta/datasource/brp
  protocols:
  - http
  - https

- id: 975b7d92-3305-4f83-94b5-586824c1f2a3
  service: 73d5bfc1-cb75-44ac-8e66-5c4e18f8de71
  name: OpenFTV-RDW-voertuigen
  regex_priority: 0
  path_handling: v0
  preserve_host: false
  https_redirect_status_code: 426
  strip_path: false
  request_buffering: true
  response_buffering: true
  methods: ~
  paths:
    - /v1/voertuigen
  protocols:
    - http
    - https

plugins:
- id: 6dabfa34-797f-4bd0-a827-991fca634ea8
  name: openftv
  enabled: true
  protocols:
    - http
    - https
  config:
    pdp: "http://host.docker.internal:9004/authzen/v1/evaluation"
    timeout: 30000

- id: 548a8fba-d86b-4e60-844d-5814b965b033
  route: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  name: cors
  enabled: true
  protocols:
    - http
    - https
  config:
    origins:
      - http://localhost:8000
      - http://localhost:8080
      - http://localhost:8443
    credentials: false
    preflight_continue: false
    methods:
      - GET
      - HEAD
      - PUT
      - PATCH
      - POST
    headers:
      - Content-Type
      - X-Api-Key
      - Doelbinding

- id: f6dd4246-8186-44e2-a713-22407ffb7469
  route: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  name: request-transformer
  enabled: true
  protocols:
    - http
    - https
  config:
    remove:
      headers:
        - Afnemersindicatie
    add:
      headers:
        - Afnemersindicatie:001.01

- id: 0f6c1d2e-5b7a-4c83-9e41-2a8d7f3b6c95
  route: 975b7d92-3305-4f83-94b5-586824c1f2a3
  name: openftv
  enabled: true
  protocols:
    - http
    - https
  config:
    pdp: "http://host.docker.internal:9005/authzen/v1/evaluation"
    timeout: 30000
    evaluate_response: true

# RDW doesn't need to know which Vlierdam employee is asking; only the openftv plugin uses it.
- id: 5c2b8e17-9d4f-4a36-b0e2-7f1a3c6d9e84
  route: 975b7d92-3305-4f83-94b5-586824c1f2a3
  name: request-transformer
  enabled: true
  protocols:
    - http
    - https
  config:
    remove:
      headers:
        - Dpl-Core-User

- id: 7a3e9b41-c2d8-4f65-8b17-e04c95d2a6f3
  route: 975b7d92-3305-4f83-94b5-586824c1f2a3
  name: cors
  enabled: true
  protocols:
    - http
    - https
  config:
    origins:
      - http://localhost:8000
      - http://localhost:8080
      - http://localhost:8443
    credentials: false
    preflight_continue: false
    methods:
      - GET
      - HEAD
      - PUT
      - PATCH
      - POST
    headers:
      - Content-Type
      - Doelbinding
      - Dpl-Core-User
