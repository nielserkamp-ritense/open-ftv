svc:
  host: "0.0.0.0"
  port: 8080
  tls:
    cert: /certs/public.pem
    key: /certs/private.key
  timeout:
    read: 15s
    write: 15s
    idle: 600s
  maxBody: 8192

log:
  output: stdout
  format: json
  level: debug
  source: true

policies:
  language: cedar
  store:
    path: /policies
    recurse: true

pip:
  store:
    path: /pip
    recurse: true
