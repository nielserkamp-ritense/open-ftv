_transform: false
_format_version: '3.0'

services:
- id: 1dbe025c-912b-4361-87c0-af8cb76f21c1
  name: RvIG-Dataspace
  enabled: true
  host: host.docker.internal
  port: 9030
  protocol: http
  retries: 5
  connect_timeout: 60000
  write_timeout: 60000
  read_timeout: 60000

routes:
- id: ef51c72d-9bcb-4438-ae4b-d3660e85fc75
  service: 1dbe025c-912b-4361-87c0-af8cb76f21c1
  name: RvIG-BRP-HaalCentraal-personen
  regex_priority: 0
  path_handling: v0
  preserve_host: false
  https_redirect_status_code: 426
  strip_path: false
  request_buffering: true
  response_buffering: true
  methods: ~
  paths:
    - /v1/haalcentraal/api/brp/personen
    - /v1/meta/datasource/brp
  protocols:
  - http
  - https

consumers:
- username: gemeente-vlierdam
  custom_id: vlierdam
  tags:
    - government-agency
# Test-only consumer with a valid key but no government-agency tag, for exercising the actual
# PDP-level deny path (as opposed to key-auth's authentication-level 401).
- username: test-non-government-agency
  custom_id: test-non-government-agency

keyauth_credentials:
- consumer: gemeente-vlierdam
  key: vlierdam_475f1db8e46d4274010247933058effe0aefcbc2
- consumer: test-non-government-agency
  key: test_org_0c4c5511a8cf31ea83680af9e2ee7f5a36b99e73

plugins:
- id: 54412cbe-a2e6-43a6-9303-ed214123af9e
  route: ef51c72d-9bcb-4438-ae4b-d3660e85fc75
  name: key-auth
  enabled: true
  protocols:
    - http
    - https
  config:
    key_names:
      - X-Api-Key
    hide_credentials: true

- id: 3b8652d2-f4f3-4341-8614-06ab14ba155e
  route: ef51c72d-9bcb-4438-ae4b-d3660e85fc75
  name: openftv
  enabled: true
  protocols:
    - http
    - https
  config:
    pdp: "http://host.docker.internal:9024/authzen/v1/evaluation"
    timeout: 30000

- id: 692cc3f7-a449-4e5c-a019-cf0b707604bd
  route: ef51c72d-9bcb-4438-ae4b-d3660e85fc75
  name: cors
  enabled: true
  protocols:
    - http
    - https
  config:
    origins:
      - http://localhost:8000
      - http://localhost:8080
      - http://localhost:8443
    credentials: false
    preflight_continue: false
    methods:
      - GET
      - HEAD
      - PUT
      - PATCH
      - POST
