_transform: false
_format_version: '3.0'

services:
- id: a28e5042-f33d-44a7-8673-6b082a930a7d
  name: OpenFTV-RvIG
  enabled: true
  host: rvig
  port: 8443
  protocol: http
  retries: 5
  connect_timeout: 60000
  write_timeout: 60000
  read_timeout: 60000

routes:
- id: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  service: a28e5042-f33d-44a7-8673-6b082a930a7d
  name: OpenFTV-BRP-HaalCentraal
  regex_priority: 0
  path_handling: v0
  preserve_host: false
  https_redirect_status_code: 426
  strip_path: false
  request_buffering: true
  response_buffering: true
  methods: ~
  paths:
    - /v1/haalcentraal/api/brp/personen
  protocols:
  - http
  - https

plugins:
- id: 6dabfa34-797f-4bd0-a827-991fca634ea8
  route: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  name: openftv
  enabled: true
  protocols:
    - http
    - https
  config:
    pdp: "http://vlierdam-pdp1:8443/authzen/v1/evaluation"
    timeout: 30000

- id: 548a8fba-d86b-4e60-844d-5814b965b033
  route: 41dd269a-d7fc-4d5e-97bf-a0ab86724d35
  name: cors
  enabled: true
  protocols:
    - http
    - https
  config:
    origins:
      - http://localhost:8000
      - http://localhost:8080
      - http://localhost:8443
    credentials: false
    preflight_continue: false
    methods:
      - GET
      - HEAD
      - PUT
      - PATCH
      - POST
