services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openftv
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-setup.sh:/docker-entrypoint-initdb.d/postgres-setup.sh
    restart: on-failure

  vlierdam-api-gateway:
    build:
      context: ../
      dockerfile: ./external/gateways/kong/Dockerfile
    ports:
      - "9002:8000/tcp"
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: "/tmp/conf/conf.yaml"
      KONG_PLUGINSERVER_NAMES: "openftv"
      KONG_PLUGINSERVER_OPENFTV_QUERY_CMD: "/usr/local/bin/openftv -dump"
      KONG_PLUGINS: "openftv,bundled"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./../demo/gemeente-vlierdam/kong:/tmp/conf

  vlierdam-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  rvig-api-gateway:
    build:
      context: ../
      dockerfile: ./external/gateways/kong/Dockerfile
    ports:
      - "9022:8000/tcp"
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: "/tmp/conf/conf.yaml"
      KONG_PLUGINSERVER_NAMES: "openftv"
      KONG_PLUGINSERVER_OPENFTV_QUERY_CMD: "/usr/local/bin/openftv -dump"
      KONG_PLUGINS: "openftv,bundled"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./../demo/rvig/kong:/tmp/conf

  rvig-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  rdw-api-gateway:
    build:
      context: ../
      dockerfile: ./external/gateways/kong/Dockerfile
    ports:
      - "9042:8000/tcp"
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: "/tmp/conf/conf.yaml"
      KONG_PLUGINSERVER_NAMES: "openftv"
      KONG_PLUGINSERVER_OPENFTV_QUERY_CMD: "/usr/local/bin/openftv -dump"
      KONG_PLUGINS: "openftv,bundled"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./../demo/rdw/kong:/tmp/conf

  rdw-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8100:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

volumes:
  postgres-data:
