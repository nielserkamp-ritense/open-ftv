apiVersion: 1

# Loki is the primary ADL datasource (fixed uid so the dashboard can reference it).
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Derived field: turn the ADL trace_id in the log line into a link-ready value.
      maxLines: 5000

# OpenSearch (optional). Requires the grafana-opensearch-datasource plugin to be
