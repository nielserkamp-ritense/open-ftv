name: openftv-unit-tests-postgres

services:
  postgres:
    image: postgres:15-alpine
    container_name: openftv-postgres
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=1500"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "idle_in_transaction_session_timeout=30s"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openftv
    volumes:
      - openftv-postgres-data:/var/lib/postgresql/data
      - ./../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 2s
    restart: on-failure

volumes:
  openftv-postgres-data:
