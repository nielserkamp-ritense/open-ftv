        minLen: 6
        maxLen: 200
      - id: "afdeling"
        description: "Afdeling"
        type: "string"
        minLen: 2
        maxLen: 100
      - id: "laadpaal-opleiding"
        description: "Datum laatste laadpaal-opleiding"
        type: "date"
    primaryKey:
      id: "pk"
      description: "Primary key: id"
      fields: ["id"]
    secondaryIndexes:
      - id: "ix2"
        description: "Index 2: naam"
        fields: ["naam"]
      - id: "ix3"
        description: "Index 3: afdeling"
        fields: ["afdeling"]
      - id: "ix4"
        description: "Index 4: laadpaal-opleiding"
        fields: ["laadpaal-opleiding"]
