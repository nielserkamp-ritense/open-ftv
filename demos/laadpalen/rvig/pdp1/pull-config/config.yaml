---
description: "PIP-data voor rvig-pdp1"

sources:
  - name: "BRP"
    description: "BRP dataspace"
    requests:
      - name: "personen"
        description: "Alle personen"
        method: "POST"
        uri: http://localhost:9030/v1/haalcentraal/api/brp/personen
        timeout: "10s"
        interval: "5m"
        initialInterval: "1s"
        contentType: "application/json"
        mapping:
          entities:
            - base: ""
              typeValue: "burger"
              idField: "bsn"
              attributes:
                - base: ""
                  map:
                    - keyValue: "gemeente"
                      valueField: "gemeente"
            - base: ""
              typeValue: "adres"
              idField: "postcode"
              attributes:
                - base: ""
                  map:
                    - keyValue: "gemeente"
                      valueField: "gemeente"
