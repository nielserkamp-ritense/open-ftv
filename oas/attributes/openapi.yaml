openapi: 3.0.0

info:
  title: Attributes, entities and relations management.
  version: 1.7.0
  description: |
    OpenAPI specification for maintaining attributes, entities and/or relations between entities.
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv

servers:
  - url: https://localhost:8080/v1
    description: Local server.

tags:
  - name: open_ftv
    description: OpenFTV
  - name: attribute
    description: Operations on attributes.
  - name: entity
    description: Operations on entities.
  - name: relation
    description: Operations on relations.

paths:
  /attributes:
    get:
      operationId: "get-attributes"
      summary: Retrieve attributes.
      description: Retrieve a list of all attributes.
      tags:
        - open_ftv
        - attribute
      responses:
        "200":
          $ref: "#/components/responses/AttributesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /attribute/{key}:
    parameters:
      - $ref: "#/components/parameters/AttributeKey"

    get:
      operationId: "get-attribute"
      summary: Retrieve attribute.
      description: Retrieve a single specified attribute.
      tags:
        - open_ftv
        - attribute
      responses:
        "200":
          $ref: "#/components/responses/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-attribute"
      summary: Add attribute.
      description: |
        Create a new attribute.
        
        If the unique key of the attribute already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - attribute
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new attribute.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attribute"
      responses:
        "201":
          $ref: "#/components/responses/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "replace-attribute"
      summary: Replace attribute.
      description: |
        Replace an existing attribute.
        
        If the unique key of the attribute does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - attribute
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new attribute.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attribute"
      responses:
        "200":
          $ref: "#/components/responses/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "remove-attribute"
      summary: Remove attribute.
      description: |
        Remove an existing attribute.
        
        If the unique key of the attribute does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - attribute
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          $ref: "#/components/responses/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /entities:
    get:
      operationId: "get-entities"
      summary: Retrieve entities.
      description: Retrieve a list of all entities.
      tags:
        - open_ftv
        - entity
      responses:
        "200":
          $ref: "#/components/responses/EntitiesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /entity/{type}/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityID"

    get:
      operationId: "get-entity"
      summary: Retrieve entity.
      description: Retrieve a specified entity.
      tags:
        - open_ftv
        - entity
      responses:
        "200":
          $ref: "#/components/responses/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-entity"
      summary: Add entity.
      description: |
        Create a new entity.
        
        If the unique type+id of the entity already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - entity
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new entity.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "remove-entity"
      summary: Replace entity.
      description: |
        Replace an existing entity.
        
        If the unique type+id of the entity does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - entity
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new entity.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "delete-entity"
      summary: Remove entity.
      description: |
        Remove an existing entity.
        
        If the unique type+id of the entity does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - entity
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          $ref: "#/components/responses/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"


  /relations:
    get:
      operationId: "get-relations"
      summary: Retrieve relations.
      description: Retrieve a list of all relations.
      tags:
        - open_ftv
        - relation
      responses:
        "200":
          $ref: "#/components/responses/RelationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /relation/{subjectType}/{subjectID}/{relation}/{objectType}/{objectID}:
    parameters:
      - $ref: "#/components/parameters/SubjectType"
      - $ref: "#/components/parameters/SubjectID"
      - $ref: "#/components/parameters/RelationType"
      - $ref: "#/components/parameters/ObjectType"
      - $ref: "#/components/parameters/ObjectID"

    get:
      operationId: "get-relation"
      summary: Retrieve relation.
      description: Retrieve a specified relation.
      tags:
        - open_ftv
        - relation
      responses:
        "200":
          $ref: "#/components/responses/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-relation"
      summary: Add relation.
      tags:
        - open_ftv
        - relation
      description: |
        Create a new relation.
        
        If the unique subject+relation+object of the relation already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new relation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relation"
      responses:
        "201":
          $ref: "#/components/responses/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "replace-relation"
      summary: Replace relation.
      description: |
        Replace an existing relation.
        
        If the unique subject+relation+object of the relation does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - relation
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new relation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relation"
      responses:
        "200":
          $ref: "#/components/responses/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "remove-relation"
      summary: Remove relation.
      description: |
        Remove an existing relation.
        
        If the unique subject+relation+object of the relation does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - open_ftv
        - relation
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          $ref: "#/components/responses/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    AttributeKey:
      in: path
      name: key
      schema:
        type: string
        minLength: 3
        maxLength: 200
      required: true
      description: Unique key of an attribute.

    EntityType:
      in: path
      name: type
      schema:
        type: string
        minLength: 3
        maxLength: 80
      required: true
      description: Type of entity.

    EntityID:
      in: path
      name: id
      schema:
        type: string
        minLength: 3
        maxLength: 200
      required: true
      description: ID of an entity.

    SubjectType:
      in: path
      name: subjectType
      schema:
        type: string
        minLength: 3
        maxLength: 80
      required: true
      description: Type of subject of a relation.

    SubjectID:
      in: path
      name: subjectID
      schema:
        type: string
        minLength: 3
        maxLength: 200
      required: true
      description: ID of the subject of a relation.

    RelationType:
      in: path
      name: relation
      schema:
        type: string
        minLength: 3
        maxLength: 80
      required: true
      description: Type of relation.

    ObjectType:
      in: path
      name: objectType
      schema:
        type: string
        minLength: 3
        maxLength: 80
      required: true
      description: Type of object of a relation.

    ObjectID:
      in: path
      name: objectID
      schema:
        type: string
        minLength: 3
        maxLength: 200
      required: true
      description: ID of the object of a relation.

    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.

    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.

  responses:
    AttributesResponse:
      description: Attributes found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Attributes"
            
    AttributeResponse:
      description: Attribute found, created, replaced or removed.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Attribute"

    EntitiesResponse:
      description: Entities found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entities"
    
    EntityResponse:
      description: Entity found, created, replaced or removed.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entity"

    RelationsResponse:
      description: Relations found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Relations"
    
    RelationResponse:
      description: Relation found, created, replaced or removed.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Relation"

    BadRequest:
      description: Bad request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotAuthorized:
      description: Not authorized.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AccessDenied:
      description: Access denied.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AlreadyExists:
      description: Resource already exists.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnexpectedError:
      description: Unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Metadata:
      type: object
      description: The metadata associated with an object.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 80
          description: The title of the object. E.g., a short description.
          example: "Worktimes schedule"
        description:
          type: string
          description: Detailed description of the object.
          example: "Daily schedule with start and end of working period"
        tags:
          type: array
          description: |
            List of tags the object is annotated with.
            
            This is used to determine which PDP (or set of PDPs) objects can be pushed to.
            
            Verify with the policies.tags endpoint.
          items:
            type: string
            maxLength: 40
            example: "FE"
      required:
        - title

    ObjectAudit:
      type: object
      description: The audit details for an object.
      properties:
        created:
          type: string
          maxLength: 36
          description: Timestamp the object was created (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        createdBy:
          type: string
          maxLength: 80
          description: User that created the object.
          example: "alice@wonderland.cc"
        updated:
          type: string
          maxLength: 36
          description: Timestamp the object was last updated (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        updatedBy:
          type: string
          maxLength: 80
          description: User that last updated the object.
          example: "bob@wonderworld.cc"
      required:
        - created
        - createdBy

    AuditEntry:
      type: object
      description: Metadata about how, when and by whom an object has been manipulated.
      properties:
        created:
          type: string
          maxLength: 36
          description: Timestamp of the log entry in RFC3339 format.
          example: "2025-08-15T07:53:41.493415Z"
        operation:
          type: string
          maxLength: 1
          description: Operation performed on the object. Any of ["C", "U", "D"].
          example: "C"
        userId:
          type: string
          maxLength: 80
          description: Unique identifier of the user who operated on the object.
          example: "alice@wonderland.cc"
      required:
        - timestamp
        - operation
        - user

    UsageData:
      type: object
      description: Metadata about when and where the object is used.
      properties:
        bundle:
          type: string
          description: Code of the bundle the object was included in.
          example: "pdp1"
        version:
          type: integer
          description: Version number of the deployment.
          example: 1
        created:
          type: string
          maxLength: 36
          description: Timestamp the deployment was created (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        createdBy:
          type: string
          maxLength: 80
          description: User that created the deployment.
          example: "alice@wonderland.cc"
        status:
          type: string
          maxLength: 20
          description: Status of the deployment.
          example: "completed"

    Attributes:
      type: array
      items:
        $ref: "#/components/schemas/Attribute"

    Attribute:
      type: object
      description: The content of an attribute (key/value pair).
      properties:
        key:
          type: string
          minLength: 3
          maxLength: 200
          description: The unique key of the attribute.
          example: "gemeentecode"
        value:
          description: The value of the attribute.
          example: "0123"
        status:
          type: string
          maxLength: 40
          description: The current status of the attribute ('concept', 'accepted', 'deployed').
          example: "concept"
        type:
          type: string
          maxLength: 40
          description: |
            The optional type of a value. By default a value is stored as-is (e.g., JSON type).
            
            The following codes for type are supported: 
            "*string*", "*integer*", "*float*", "*boolean*", "*date*", "*time*", "*timestamp*".
            Optionally, the type can be specified as one of the standard XSD types (e.g. "*xsd:byte*").
            
            An *integer* value (of any size) is stored as a 64-bit signed or unsigned integer.
            
            A *float* value is stored with double precision.
            
            A *boolean* value can be *true* (case-insensitive) or *1* to represent a true state,
            or any other value to represent a false state.
            
            A *date*, *time* or *timestamp* value should adhere to the format as described in RFC3339.
            If it cannot be decoded according to RFC3339, a 400 response status code will be returned.
        metadata:
          $ref: "#/components/schemas/Metadata"
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the attribute.
          items:
            $ref: "#/components/schemas/AuditEntry"
        usageData:
          type: array
          description: Usage data for the policy.
          items:
            $ref: "#/components/schemas/UsageData"
      required:
        - key
        - value
        - status
        - metadata
        - audit

    Entities:
      type: array
      items:
        $ref: "#/components/schemas/Entity"

    Entity:
      type: object
      description: |
        The content of an entity.
        
        The combination of *type* and *id* defines the unique key of an entity.
      properties:
        type:
          type: string
          minLength: 3
          maxLength: 80
          description: The type of entity.
          example: "user"
        id:
          type: string
          minLength: 3
          maxLength: 200
          description: The identification of the entity.
          example: "alice"
        status:
          type: string
          maxLength: 40
          description: The current status of the entity ('concept', 'accepted', 'deployed').
          example: "concept"
        attributes:
          type: array
          description: Optional attributes of the entity.
          items:
            $ref: "#/components/schemas/Attribute"
        metadata:
          $ref: "#/components/schemas/Metadata"
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the entity.
          items:
            $ref: "#/components/schemas/AuditEntry"
        usageData:
          type: array
          description: Usage data for the policy.
          items:
            $ref: "#/components/schemas/UsageData"
      required:
        - type
        - id
        - status
        - metadata
        - audit

    Relations:
      type: array
      items:
        $ref: "#/components/schemas/Relation"

    Relation:
      type: object
      description: |
        The content of a relation.
        
        The combination of *subject type/id*, *relation* and *object type/id* must be unique for all relations.
      properties:
        id:
          type: string
          maxLength: 36
          description: The unique identifier of the relation (UUID).
          example: "<uuid>"
        status:
          type: string
          maxLength: 40
          description: The current status of the relation ('concept', 'accepted', 'deployed').
          example: "concept"
        subjectType:
          type: string
          minLength: 3
          maxLength: 80
          description: The type of subject of the relation.
          example: "user"
        subjectId:
          type: string
          minLength: 3
          maxLength: 200
          description: The identifier of the subject of the relation.
          example: "alice"
        relation:
          type: string
          minLength: 3
          maxLength: 80
          description: The type of relation.
          example: "managerOf"
        objectType:
          type: string
          minLength: 3
          maxLength: 80
          description: The type of object of the relation.
          example: "user"
        objectId:
          type: string
          minLength: 3
          maxLength: 200
          description: The identifier of the object of the relation.
          example: "bob"
        attributes:
          type: array
          description: Optional attributes of the relation.
          items:
            $ref: "#/components/schemas/Attribute"
        metadata:
          $ref: "#/components/schemas/Metadata"
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the relation.
          items:
            $ref: "#/components/schemas/AuditEntry"
        usageData:
          type: array
          description: Usage data for the policy.
          items:
            $ref: "#/components/schemas/UsageData"
      required:
        - id
        - status
        - subjectType
        - subjectId
        - relation
        - objectType
        - objectId
        - metadata
        - audit

    Error:
      type: object
      description: The response for an error (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
