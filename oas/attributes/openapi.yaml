openapi: 3.0.0

info:
  title: Attribute management.
  version: 1.1.0
  description: |
    OpenAPI specification for maintaining attributes, entities and/or relations between entities.
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/ftv-implementatie

servers:
  - url: https://localhost:8080/v1
    description: Local server.

tags:
  - name: attribute
    description: Operations on attributes.
  - name: entity
    description: Operations on entities.
  - name: relation
    description: Operations on relations.

paths:
  /attributes:
    get:
      operationId: "get-attributes"
      summary: Retrieve attributes.
      description: Endpoint to retrieve all attributes.
      tags:
        - attribute
      responses:
        "200":
          description: Attributes found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /attribute/{key}:
    parameters:
      - $ref: "#/components/parameters/AttributeKey"

    get:
      operationId: "get-attribute"
      summary: Retrieve attribute.
      description: Retrieve a specified cached attribute.
      tags:
        - attribute
      responses:
        "200":
          description: Attribute found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
              examples:
                GET_WERKTIJDEN_200_OK:
                  summary: Successful retrieval of attribute 'werktijden'.
                  value:
                    key: werktijden
                    value: x
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-attribute"
      summary: Add attribute.
      description: |
        If the unique key of the attribute already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - attribute
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new attribute.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attribute"
      responses:
        "201":
          description: Attribute created.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "replace-attribute"
      summary: Replace attribute.
      description: |
        If the unique key of the attribute does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - attribute
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new attribute.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attribute"
      responses:
        "200":
          description: Attribute replaced.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "remove-attribute"
      summary: Remove attribute.
      description: |
        If the unique key of the attribute does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - attribute
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          description: Attribute removed.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /entities:
    get:
      operationId: "get-entities"
      summary: Retrieve entities.
      description: Endpoint to retrieve all entities.
      tags:
        - entity
      responses:
        "200":
          description: Entities found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitiesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /entity/{type}/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityID"

    get:
      operationId: "get-entity"
      summary: Retrieve entity.
      description: Retrieve a specified cached entity.
      tags:
        - entity
      responses:
        "200":
          description: Entity found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-entity"
      summary: Add entity.
      description: |
        If the unique type+id of the entity already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - entity
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new entity.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          description: Entity created.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "remove-entity"
      summary: Replace entity.
      description: |
        If the unique type+id of the entity does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - entity
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new entity.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          description: Entity replaced.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "delete-entity"
      summary: Remove entity.
      description: |
        If the unique type+id of the entity does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - entity
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          description: Entity removed.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"


  /relations:
    get:
      operationId: "get-relations"
      summary: Retrieve relations.
      description: Endpoint to retrieve all relations.
      tags:
        - relation
      responses:
        "200":
          description: Relations found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /relation/{subjectType}/{subjectID}/{relation}/{objectType}/{objectID}:
    parameters:
      - $ref: "#/components/parameters/SubjectType"
      - $ref: "#/components/parameters/SubjectID"
      - $ref: "#/components/parameters/RelationType"
      - $ref: "#/components/parameters/ObjectType"
      - $ref: "#/components/parameters/ObjectID"

    get:
      operationId: "get-relation"
      summary: Retrieve relation.
      description: Retrieve a specified cached relation.
      tags:
        - relation
      responses:
        "200":
          description: Relation found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-relation"
      summary: Add relation.
      tags:
        - relation
      description: |
        If the unique subject+relation+object of the relation already exists, a 409 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new relation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relation"
      responses:
        "201":
          description: Entity created.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "replace-relation"
      summary: Replace relation.
      description: |
        If the unique subject+relation+object of the relation does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - relation
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Content of the new relation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relation"
      responses:
        "200":
          description: Relation replaced.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "remove-relation"
      summary: Remove relation.
      description: |
        If the unique subject+relation+object of the relation does not exist, a 404 response status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - relation
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          description: Relation removed.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    AttributeKey:
      in: path
      name: key
      schema:
        type: string
        minLength: 3
        maxLength: 500
      required: true
      description: Unique key of an attribute.
      examples:
        GET_ATTRIBUTE_WERKTIJDEN_200_OK:
          value: "werktijden"
        GET_ATTRIBUTE_404_NOTFOUND:
          value: "abc98def76"

    EntityType:
      in: path
      name: type
      schema:
        type: string
        minLength: 3
        maxLength: 100
      required: true
      description: Type of entity.

    EntityID:
      in: path
      name: id
      schema:
        type: string
        minLength: 3
        maxLength: 500
      required: true
      description: ID of an entity.

    SubjectType:
      in: path
      name: subjectType
      schema:
        type: string
        minLength: 3
        maxLength: 100
      required: true
      description: Type of subject of a relation.

    SubjectID:
      in: path
      name: subjectID
      schema:
        type: string
        minLength: 3
        maxLength: 500
      required: true
      description: ID of the subject of a relation.

    RelationType:
      in: path
      name: relation
      schema:
        type: string
        minLength: 3
        maxLength: 100
      required: true
      description: Type of relation.

    ObjectType:
      in: path
      name: objectType
      schema:
        type: string
        minLength: 3
        maxLength: 100
      required: true
      description: Type of object of a relation.

    ObjectID:
      in: path
      name: objectID
      schema:
        type: string
        minLength: 3
        maxLength: 500
      required: true
      description: ID of the object of a relation.

    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.

    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.

  responses:
    BadRequest:
      description: Bad request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotAuthorized:
      description: Not authorized.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AccessDenied:
      description: Access denied.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            GET_ATTRIBUTE_404_NOTFOUND:
              summary: Unsuccessful retrieval of unknown attribute.
              value:
                title: Not found

    AlreadyExists:
      description: Resource already exists.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnexpectedError:
      description: Unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Attribute:
      type: object
      description: The content of an attribute (key/value pair).
      properties:
        key:
          type: string
          description: The unique key of the attribute.
        value:
          description: The value of the attribute.
        type:
          type: string
          description: |
            The optional type of a value. By default a value is stored as-is.
            
            The following codes for type are supported: 
            "*string*", "*integer*", "*float*", "*boolean*", "*date*", "*time*", "*timestamp*".
            Optionally, the type can be specified as one of the standard XSD types (e.g. "*xsd:byte*").
            
            An *integer* value is stored as a 64-bit signed integer.
            
            A *float* value is stored with double precision.
            
            A *boolean* value can be *true* (case-insensitive) or *1* to represent a true state,
            or any other value to represent a false state.
            
            A *date*, *time* or *timestamp* value should adhere to the format as described in ISO-8601.
            If it cannot be decoded according to ISO-8601, a 400 response status code will be returned.
      required:
        - key
        - value

    Entity:
      type: object
      description: |
        The content of an entity.
        
        The combination of *type* and *id* defines the unique key of an entity.
      properties:
        type:
          type: string
          description: The type of entity.
          example: "user"
        id:
          type: string
          description: The identification of the entity.
          example: "alice"
        attributes:
          type: array
          description: Optional attributes of the entity.
          items:
            $ref: "#/components/schemas/Attribute"
      required:
        - type
        - id

    Relation:
      type: object
      description: |
        The content of a relation.
        
        The combination of *subject type/id*, *relation* and *object type/id* defines the unique key of a relation.
      properties:
        subjectType:
          type: string
          description: The type of subject of the relation.
          example: "user"
        subjectId:
          type: string
          description: The identifier of the subject of the relation.
          example: "alice"
        relation:
          type: string
          description: The type of relation.
          example: "managerOf"
        objectType:
          type: string
          description: The type of object of the relation.
          example: "user"
        objectId:
          type: string
          description: The identifier of the object of the relation.
          example: "bob"
        attributes:
          type: array
          description: Optional attributes of the relation.
          items:
            $ref: "#/components/schemas/Attribute"
      required:
        - subjectType
        - subjectId
        - relation
        - objectType
        - objectId

    AttributesResponse:
      type: array
      items:
        $ref: "#/components/schemas/Attribute"

    AttributeResponse:
      $ref: "#/components/schemas/Attribute"

    EntitiesResponse:
      type: array
      items:
        $ref: "#/components/schemas/Entity"

    EntityResponse:
      $ref: "#/components/schemas/Entity"

    RelationsResponse:
      type: array
      items:
        $ref: "#/components/schemas/Relation"

    RelationResponse:
      $ref: "#/components/schemas/Relation"

    ErrorResponse:
      type: object
      description: The response for an error (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
