openapi: 3.0.0

info:
  description: |
    OpenAPI specification for AuthZEN spec.
    See: https://openid.net/specs/authorization-api-1_0-03.html
  version: 1.4.0
  title: AuthZEN
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv

servers:
  - url: https://localhost:8080/authzen/v1
    description: Local server.

tags:
  - name: authZEN
    description: AuthZEN specification.
  - name: evaluation
    description: AuthZEN evaluation endpoints.
  - name: search
    description: AuthZEN search endpoints.
  - name: metadata
    description: PDP metadata endpoint.

paths:
  /evaluation:
    post:
      operationId: "access-evaluation"
      summary: Access evaluation request.
      description: Endpoint to evaluate a single access request.
      tags:
        - authZEN
        - evaluation
      parameters:
        - name: "Authorization"
          in: header
          description: Request header containing the credentials to authenticate the client (PEP) to the authentication service (PDP).
          schema:
            type: string
        - name: "X-Request-ID"
          in: header
          description: |
            Request header containing the unique ID of the request.
            This will be returned in the response.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/EvaluationRequest"
      responses:
        "200":
          $ref: "#/components/responses/EvaluationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /evaluations:
    post:
      operationId: "access-evaluations"
      summary: Access evaluations request.
      description: |
        The Access Evaluations API defines the message exchange pattern between a client (PEP) and an authorization service (PDP)
        for evaluating multiple access evaluations within the scope of a single message exchange (also known as "boxcarring" requests).
      tags:
        - authZEN
        - evaluation
      parameters:
        - name: "Authorization"
          in: header
          description: Request header containing the credentials to authenticate the client (PEP) to the authentication service (PDP).
          schema:
            type: string
        - name: "X-Request-ID"
          in: header
          description: |
            Request header containing the unique ID of the request.
            This will be returned in the response.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/EvaluationsRequest"
      responses:
        "200":
          $ref: "#/components/responses/EvaluationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /search/subject:
    post:
      operationId: "subject-search"
      summary: Perform a subject search.
      description: Endpoint to perform a subject search operation.
      tags:
        - authZEN
        - search
      parameters:
        - name: "Authorization"
          in: header
          description: Request header containing the credentials to authenticate the client (PEP) to the authentication service (PDP).
          schema:
            type: string
        - name: "X-Request-ID"
          in: header
          description: |
            Request header containing the unique ID of the request.
            This will be returned in the response.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/SearchRequest"
      responses:
        "200":
          $ref: "#/components/responses/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /search/resource:
    post:
      operationId: "resource-search"
      summary: Perform a resource search.
      description: Endpoint to perform a resource search operation.
      tags:
        - authZEN
        - search
      parameters:
        - name: "Authorization"
          in: header
          description: Request header containing the credentials to authenticate the client (PEP) to the authentication service (PDP).
          schema:
            type: string
        - name: "X-Request-ID"
          in: header
          description: |
            Request header containing the unique ID of the request.
            This will be returned in the response.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/SearchRequest"
      responses:
        "200":
          $ref: "#/components/responses/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /search/action:
    post:
      operationId: "action-search"
      summary: Perform a action search.
      description: Endpoint to perform a action search operation.
      tags:
        - authZEN
        - search
      parameters:
        - name: "Authorization"
          in: header
          description: Request header containing the credentials to authenticate the client (PEP) to the authentication service (PDP).
          schema:
            type: string
        - name: "X-Request-ID"
          in: header
          description: |
            Request header containing the unique ID of the request.
            This will be returned in the response.
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/SearchActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/SearchActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /metadata:
    get:
      operationId: "get-metadata"
      summary: Metadata request.
      description: |
        Endpoint to return PDP metadata describing the AuthZEN configuration.
        
        For full AuthZEN compliance this endpoint should be accessible at the well known URI path:
          - /.well-known/authzen-configuration
      tags:
        - authZEN
        - metadata
      responses:
        "200":
          $ref: "#/components/responses/MetadataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

components:
  requestBodies:
    EvaluationRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvaluationObject"
      description: The body of the request sent to the evaluation service.
      required: true

    EvaluationsRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvaluationsObject"
      description: The body of the request sent to the evaluations service.
      required: true

    SearchRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchObject"
      description: The body of the request sent to a search service.
      required: true

    SearchActionRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchActionObject"
      description: The body of the request sent to an action search service.
      required: true

  responses:
    EvaluationResponse:
      description: |
        The authorization request has been handled successfully.
        This does not mean the request is authorized, it means that the request has been processed successfully.
      headers:
        API-Version:
          description: Full version number of the API.
          schema:
            type: string
        X-Request-ID:
          description: Returns the X-Request-ID from the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvaluationDecision"

    EvaluationsResponse:
      description: |
        The authorizations request has been handled successfully.
        This does not mean the request is authorized, it means that the request has been processed successfully.
      headers:
        API-Version:
          description: Full version number of the API.
          schema:
            type: string
        X-Request-ID:
          description: Returns the X-Request-ID from the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvaluationsDecision"

    SearchResponse:
      description: |
        The search request has been handled successfully.
      headers:
        API-Version:
          description: Full version number of the API.
          schema:
            type: string
        X-Request-ID:
          description: Returns the X-Request-ID from the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchResults"

    SearchActionResponse:
      description: |
        The action search request has been handled successfully.
      headers:
        API-Version:
          description: Full version number of the API.
          schema:
            type: string
        X-Request-ID:
          description: Returns the X-Request-ID from the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchActionResults"

    MetadataResponse:
      description: |
        The metadata request has been handled successfully.
      headers:
        API-Version:
          description: Full version number of the API.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MetadataObject"

    BadRequest:
      description: The request has failed due to malformed or invalid input data.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotAuthorized:
      description: The request has failed due to an unauthorized request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AccessDenied:
      description: The request has failed due to being forbidden.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnexpectedError:
      description: The request has failed due to an unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Entity:
      type: object
      description: |
        The entity associated with an authorization request.
        This can be the subject (e.g. principal) or the resource.
      properties:
        type:
          type: string
          description: The type of the entity.
          example: "user"
        id:
          type: string
          description: The unique ID of the entity.
          example: "alice"
        properties:
          type: object
          description: Optional attributes for the entity.
      required:
        - type
        - id

    Action:
      type: object
      description: The action associated with an authorization request.
      properties:
        name:
          type: string
          description: The name of the action.
          example: "can_read"
        properties:
          type: object
          description: Optional attributes for the action.
      required:
        - type

    ReasonField:
      type: object
      description: Map of one or more reasons, with a language-identifier as the key.

    ReasonObject:
      type: object
      description: Specifies a particular reason.
      properties:
        id:
          type: string
          description: Unique identifier of the reason.
        reasonAdmin:
          $ref: "#/components/schemas/ReasonField"
        reasonUser:
          $ref: "#/components/schemas/ReasonField"
      required:
        - id

    EvaluationObject:
      type: object
      description: Evaluation object model.
      properties:
        subject:
          $ref: "#/components/schemas/Entity"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Entity"
        context:
          description: Optional context of the request.
          type: object
      required:
        - subject
        - action
        - resource

    EvaluationDecision:
      type: object
      description: Evaluation decision model.
      properties:
        decision:
          type: boolean
          description: true if the request is authorized.
        context:
          $ref: "#/components/schemas/ReasonObject"
      required:
        - decision

    EvaluationsObject:
      type: object
      description: Evaluations object model.
      properties:
        evaluations:
          type: array
          description: list of evaluation requests to test.
          items:
            $ref: "#/components/schemas/EvaluationObject"
        subject:
          $ref: "#/components/schemas/Entity"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Entity"
        context:
          description: Optional default context of the request.
          type: object
        options:
          type: object
          description: Options for the evaluations request.
          properties:
            evaluation_semantics:
              type: string
              description: |
                By default, every request in the evaluations array is executed and a response returned in the same array order.
                This is the most common use-case for boxcarring multiple evaluation requests in a single payload.
                
                To select the desired evaluations semantic, use exactly one of the following values:
                  - execute_all = default.
                  - deny_on_first_deny = halt processing after first deny.
                  - permit_on_first_permit = halt processing after first allow.
      required:
        - evaluations

    EvaluationsDecision:
      type: object
      description: Evaluations decision model.
      properties:
        evaluations:
          type: array
          description: List of evaluation decisions.
          items:
            $ref: "#/components/schemas/EvaluationDecision"
      required:
        - evaluations

    PageRequest:
      type: object
      description: Pagination options.
      properties:
        token:
          type: string
          description: Token used for pagination.
          example: "a3M9NDU2O3N6PTI="
        limit:
          type: integer
          description: Maximum number of results to return.
          example: 2
        properties:
          type: object
          description: Implementation-specific pagination request attributes.

    PageResponse:
      type: object
      description: |
        Pagination options.
        
        !!NOTE!! The NL API Design Rules only allow *lowerCamelCase* for response object properties.
        However the AuthZEN standard uses *kebab_case* for some properties.
        So these properties will be flagged when using the NL API Design Rules.
      properties:
        next_token:
          type: string
          description: Token used for pagination.
          example: "a3M9NDU2O3N6PTI="
        count:
          type: integer
          description: Number of results returned.
          example: 2
        total:
          type: integer
          description: Total number of results available.
          example: 3
        properties:
          type: object
          description: Implementation-specific pagination response attributes.

    SearchEntity:
      type: object
      description: |
        An entity (subject or resource) associated with a search request.
        This means the id can be empty.
      properties:
        type:
          type: string
          description: The type of the search entity.
          example: "user"
        id:
          type: string
          description: The unique ID of the search entity.
          example: "alice"
        properties:
          type: object
          description: Optional attributes for the search entity.
      required:
        - type

    SearchObject:
      type: object
      description: Search object model.
      properties:
        subject:
          $ref: "#/components/schemas/SearchEntity"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/SearchEntity"
        context:
          description: Optional context of the request.
          type: object
        page:
          $ref: "#/components/schemas/PageRequest"
      required:
        - subject
        - action
        - resource

    SearchResult:
      type: object
      description: Search result model.
      properties:
        type:
          type: string
          description: The type of the entity.
          example: "user"
        id:
          type: string
          description: The unique ID of the entity.
          example: "alice"

    SearchResults:
      type: object
      description: Search results model.
      properties:
        results:
          type: array
          description: List of search results.
          items:
            $ref: "#/components/schemas/SearchResult"
        page:
          $ref: "#/components/schemas/PageResponse"
      required:
        - results

    SearchActionObject:
      type: object
      description: Search action object model.
      properties:
        subject:
          $ref: "#/components/schemas/Entity"
        resource:
          $ref: "#/components/schemas/Entity"
        context:
          description: Optional context of the request.
          type: object
        page:
          $ref: "#/components/schemas/PageRequest"
      required:
        - subject
        - resource

    SearchActionResult:
      type: object
      description: Search action result model.
      properties:
        name:
          type: string
          description: The name of the action.
          example: "can_read"

    SearchActionResults:
      type: object
      description: Search action results model.
      properties:
        results:
          type: array
          description: List of action search results.
          items:
            $ref: "#/components/schemas/SearchActionResult"
        page:
          $ref: "#/components/schemas/PageResponse"
      required:
        - results

    MetadataObject:
      type: object
      description: |
        Metadata model.
        
        !!NOTE!! The NL API Design Rules only allow *lowerCamelCase* for response object properties.
        However the AuthZEN standard uses *kebab_case* for some properties.
        So these properties will be flagged when using the NL API Design Rules.
      properties:
        policy_decision_point:
          type: string
          description: Base URL of the PDP. Must match with the base URL used to retrieve the metadata.
          example: "https://pdp.organisatie.nl/"
        access_evaluation_endpoint:
          type: string
          description: URL to AuthZEN compatible evaluation endpoint.
          example: "https://pdp.organisatie.nl/authzen/v1/evaluation"
        access_evaluations_endpoint:
          type: string
          description: URL to AuthZEN compatible evaluations endpoint.
          example: "https://pdp.organisatie.nl/authzen/v1/evaluations"
        search_subject_endpoint:
          type: string
          description: URL to AuthZEN compatible subject search endpoint.
          example: "https://pdp.organisatie.nl/authzen/v1/search/subject"
        search_resource_endpoint:
          type: string
          description: URL to AuthZEN compatible resource search endpoint.
          example: "https://pdp.organisatie.nl/authzen/v1/search/resource"
        search_action_endpoint:
          type: string
          description: URL to AuthZEN action search endpoint.
          example: "https://pdp.organisatie.nl/authzen/v1/search/action"
        capabilities:
          type: array
          description: list of registered IANA URNs referencing PDP specific capabilities.
          items:
            type: string
        signed_metadata:
          type: string
          description: JWT containing metadata parameters about the endpoints as claims.
      required:
        - policy_decision_point
        - access_evaluation_endpoint

    ErrorResponse:
      type: object
      description: Error response model (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
