openapi: 3.0.0

info:
  description: |
    OpenAPI specification for maintaining policies.
  version: 1.1.0
  title: Policy management

servers:
  - url: https://localhost:8080/v1
    description: Local server.

paths:
  /policies:
    get:
      summary: Retrieve policies.
      responses:
        200:
          description: Policies found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliciesResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/NotAuthorized"
        403:
          $ref: "#/components/responses/AccessDenied"
        404:
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/UnexpectedError"

  /policy/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyID"

    get:
      summary: Retrieve policy.
      description: Retrieve a specified cached policy.
      responses:
        200:
          description: Policy found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/NotAuthorized"
        403:
          $ref: "#/components/responses/AccessDenied"
        404:
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/UnexpectedError"

    put:
      summary: Add policy.
      description: |
        If the unique identifier of the policy already exists, a 409 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        201:
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/NotAuthorized"
        403:
          $ref: "#/components/responses/AccessDenied"
        409:
          $ref: "#/components/responses/AlreadyExists"
        5XX:
          $ref: "#/components/responses/UnexpectedError"

    post:
      summary: Replace policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        200:
          description: Policy replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/NotAuthorized"
        403:
          $ref: "#/components/responses/AccessDenied"
        404:
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/UnexpectedError"

    delete:
      summary: Remove policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        200:
          description: Policy removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/NotAuthorized"
        403:
          $ref: "#/components/responses/AccessDenied"
        404:
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    PolicyID:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: Unique identifier of a policy.
    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.
    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotAuthorized:
      description: Not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccessDenied:
      description: Access denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AlreadyExists:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Policy:
      type: object
      description: The content of a policy.
      properties:
        id:
          type: string
          description: The unique identifier of the policy.
        language:
          type: string
          description: The language of the policy.
          example: "rego"
        url:
          type: string
          description: Link to the actual policy.
        source:
          type: string
          description: The unique identifier of the source.
        target:
          type: string
          description: The unique identifier of the target.
        rvvaID:
          type: string
          description: The unique identifier of the Register of Activities (RvVA).
      required:
        - id
        - language
        - url
        - source
        - target
        - rvvaID

    PoliciesResponse:
      type: array
      items:
        $ref: "#/components/schemas/Policy"

    PolicyResponse:
      $ref: "#/components/schemas/Policy"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: An optional message detailing the error.
          nullable: false
        data:
          type: object
          description: Optional extra context of the error.
          nullable: false
      required:
        - message
        - data
