openapi: 3.0.0

info:
  description: |
    OpenAPI specification for maintaining policies.
  version: 1.6.1
  title: Policy management
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv

servers:
  - url: https://localhost:8080/v1
    description: Local server.

tags:
  - name: language
    description: Operations on policy languages.
  - name: tag
    description: Operations on tags.
  - name: policy
    description: Operations on policies.

paths:
  /languages:
    get:
      operationId: "get-languages"
      summary: Retrieve languages.
      description: Endpoint to retrieve the list of supported policy languages.
      tags:
        - language
      responses:
        "200":
          $ref: "#/components/responses/LanguagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /tags:
    get:
      operationId: "get-tags"
      summary: Retrieve tags.
      description: Endpoint to retrieve the list of tags.
      tags:
        - tag
      responses:
        "200":
          $ref: "#/components/responses/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policies:
    get:
      operationId: "get-policies"
      summary: Retrieve policies.
      description: Endpoint to retrieve all policy keys.
      tags:
        - policy
      responses:
        "200":
          $ref: "#/components/responses/PoliciesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policy/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyID"

    get:
      operationId: "get-policy"
      summary: Retrieve policy.
      description: Retrieve a specified cached policy.
      tags:
        - policy
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "create-policy"
      summary: Add policy.
      description: |
        If the unique identifier of the policy already exists, a 409 status code will be returned.        
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "201":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "update-policy"
      summary: Replace policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "delete-policy"
      summary: Remove policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    PolicyID:
      in: path
      name: id
      schema:
        type: string
        maxLength: 36
      required: true
      description: Unique identifier of a policy (UUID).
      example: "b4911124-e92a-482f-80b4-eb02383378ae"

    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.
      example: true

    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.
      example: true

  responses:
    LanguagesResponse:
      description: Languages found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Languages"

    TagsResponse:
      description: Tags found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tags"

    PoliciesResponse:
      description: Policies found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Policies"

    PolicyResponse:
      description: Policy found, created, replaced or removed.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Policy"

    BadRequest:
      description: Bad request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotAuthorized:
      description: Not authorized.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AccessDenied:
      description: Access denied.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AlreadyExists:
      description: Resource already exists.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnexpectedError:
      description: Unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
          example: "1.0.0"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Metadata:
      type: object
      description: The metadata associated with a policy.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 80
          description: The title of the policy. E.g., a short description.
          example: "BRP:Person:Subsidy"
        description:
          type: string
          description: Detailed description of the policy.
          example: "BRP - access person details for a subsidy"
        rvvaId:
          type: string
          minLength: 3
          maxLength: 80
          description: |
            The unique identifier of the Register van Verwerkings-Activiteiten (RvVA).
            Only required when the policy is linked directly with an item in the RvVA.
            The value is considered as one of the tags of the policy.
          example: "<RvVA-identifier>"
        url:
          type: string
          minLength: 10
          maxLength: 400
          description: Link to the policy. Required when the policy is stored externally.
        tags:
          type: array
          description: |
            List of tags the policy is annotated with.
            
            This is used to determine which PDP (or set of PDPs) objects can be pushed to.
            
            Verify with the tags endpoint.
          items:
            type: string
            maxLength: 40
            example: "BRP"
      required:
        - title

    ObjectAudit:
      type: object
      description: The audit details of an object.
      properties:
        created:
          type: string
          maxLength: 36
          description: Timestamp the object was created (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        createdBy:
          type: string
          maxLength: 80
          description: User that created the object.
          example: "alice@wonderland.cc"
        updated:
          type: string
          maxLength: 36
          description: Timestamp the object was last updated (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        updatedBy:
          type: string
          maxLength: 80
          description: User that last updated the object.
          example: "bob@wonderworld.cc"
      required:
        - created
        - createdBy

    AuditEntry:
      type: object
      description: Metadata about how, when and by whom an object has been manipulated.
      properties:
        created:
          type: string
          maxLength: 36
          description: Timestamp of the log entry in RFC3339 format.
          example: "2025-08-15T07:53:41.493415Z"
        operation:
          type: string
          maxLength: 1
          description: Operation performed on the object. Any of ["C", "U", "D"].
          example: "C"
        user:
          type: string
          maxLength: 80
          description: Unique identifier of the user who operated on the object.
          example: "alice@wonderland.cc"
      required:
        - timestamp
        - operation
        - user

    UsageData:
      type: object
      description: Metadata about when and where the object is used.
      properties:
        bundle:
          type: string
          description: Code of the bundle the object was included in.
          example: "pdp1"
        version:
          type: integer
          description: Version number of the deployment.
          example: 1
        created:
          type: string
          maxLength: 36
          description: Timestamp the deployment was created (RFC3339 format).
          example: "2025-08-15T07:53:41.493415Z"
        createdBy:
          type: string
          maxLength: 80
          description: User that created the deployment.
          example: "alice@wonderland.cc"
        status:
          type: string
          maxLength: 20
          description: Status of the deployment.
          example: "completed"

    Languages:
      type: array
      items:
        $ref: "#/components/schemas/Language"

    Language:
      type: object
      description: The details of a policy language.
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 40
          description: The unique identifier of the policy language.
          example: "rego"
        name:
          type: string
          minLength: 3
          maxLength: 80
          description: Name of the policy language in human-readable form.
          example: "Open Policy Agent - REGO language"
        description:
          type: string
          description: Detailed description of the policy language.
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the policy language.
          items:
            $ref: "#/components/schemas/AuditEntry"
      required:
        - id
        - name
        - audit

    Tags:
      type: array
      items:
        $ref: "#/components/schemas/Tag"

    Tag:
      type: object
      description: The details of a tag.
      properties:
        id:
          type: string
          minLength: 3
          maxLength: 40
          description: The unique identifier of the tag.
          example: "brp"
        name:
          type: string
          minLength: 3
          maxLength: 80
          description: Name of the tag in human-readable form.
          example: "Basis Registratie Personen"
        description:
          type: string
          description: Detailed description of the tag.
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the tag.
          items:
            $ref: "#/components/schemas/AuditEntry"
      required:
        - id
        - name
        - audit

    Policies:
      type: array
      items:
        $ref: "#/components/schemas/Policy"

    Policy:
      type: object
      description: The content of a policy.
      properties:
        id:
          type: string
          maxLength: 36
          description: The unique identifier of the policy (UUID).
          example: "e8fce68e-beb6-494f-b6c1-9b0f8f6cac56"
        language:
          type: string
          minLength: 3
          maxLength: 40
          description: |
            The language of the policy.
            The value is case-insensitive.
            The value is considered as one of the tags of the policy.
            
            Supported values:
            - "opa/rego"; alternatives: "opa", "rego", "opa-rego".
            - "cedar".
            - "cerbos/cel"; alternatives: "cerbos", "cel", "cerbos-cel". 
            - "openfga"; alternative: "open-fga".
            
            Verify with the languages endpoint.
          example: "cedar"
        data:
          type: string
          description: Content of the policy. Required when the policy is stored internally.
          example: |
            permit (
              principal == doelbinding::"subsidies",
              action == action::"POST",
              resource is service
            )
            when {
              principal has brpPersonen &&
              resource.code == "BRP"
            };
        metadata:
          $ref: "#/components/schemas/Metadata"
        audit:
          $ref: "#/components/schemas/ObjectAudit"
        auditLog:
          type: array
          description: Audit log for the policy.
          items:
            $ref: "#/components/schemas/AuditEntry"
        usageData:
          type: array
          description: Usage data for the policy.
          items:
            $ref: "#/components/schemas/UsageData"
      required:
        - id
        - language
        - metadata
        - audit

    Error:
      type: object
      description: The response for an error (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
