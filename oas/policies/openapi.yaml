openapi: 3.0.0

info:
  description: |
    OpenAPI specification for maintaining policies.
  version: 1.2.0
  title: Policy management
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv

servers:
  - url: https://localhost:8080/v1
    description: Local server.

tags:
  - name: policy
    description: Operations on policies.
  - name: odrl
    description: ODRL-AP-NL im- and export of the administered policies.

paths:
  /policies:
    get:
      operationId: "get-policies"
      summary: Retrieve policies.
      description: Endpoint to retrieve all policy keys.
      tags:
        - policy
      responses:
        "200":
          description: Policies found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliciesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policy/{language}/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyLanguage"
      - $ref: "#/components/parameters/PolicyID"

    get:
      operationId: "get-policy"
      summary: Retrieve policy.
      description: Retrieve a specified cached policy.
      tags:
        - policy
      responses:
        "200":
          description: Policy found.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "add-policy"
      summary: Add policy.
      description: |
        If the unique identifier of the policy already exists, a 409 status code will be returned.        
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "201":
          description: Policy created.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "replace-policy"
      summary: Replace policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: Policy replaced.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "delete-policy"
      summary: Remove policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          description: Policy removed.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policy-hash/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        description: Lowercase-hex SHA-256 of the policy source content.
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
    get:
      operationId: "get-policy-by-hash"
      summary: Resolve a policy by its content hash.
      description: |
        Returns the exact policy source recorded under the given SHA-256 content hash.
        This backs the ADL content-addressable resolution path: an
        `adl.core.policies` reference of the form `{key: hash}` logged at decision
        time is resolved here to the precise policy source that governed the decision.
        Older versions of a policy remain retrievable under their own hash after the
        live policy has been replaced (retention implication: the content-addressable
        index grows monotonically and is not garbage-collected).
      tags:
        - policy
      responses:
        "200":
          description: Policy source found.
          headers:
            X-Policy-Id:
              schema:
                type: string
              description: Identifier of the resolved policy.
            X-Policy-Language:
              schema:
                type: string
              description: Language of the resolved policy.
            X-Policy-Hash:
              schema:
                type: string
              description: The requested content hash (echoed).
          content:
            text/plain:
              schema:
                type: string
                description: The raw policy source content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /odrl/export:
    get:
      operationId: "odrl-export"
      summary: Export all policies as ODRL-AP-NL.
      description: |
        Describes the administered policies as one ODRL-AP-NL document:
        each executable policy (Rego/Cedar/OpenFGA) becomes an apnl:PolicyArtifact
        under an odrl:Offer/Set with apnl:conformsToPolicy constraints.
        The response syntax follows the Accept header (text/turtle default).
      tags:
        - odrl
      responses:
        "200":
          description: ODRL-AP-NL export.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: object
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /odrl/export/{language}/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyLanguage"
      - $ref: "#/components/parameters/PolicyID"

    get:
      operationId: "odrl-export-policy"
      summary: Export one policy as ODRL-AP-NL.
      description: |
        Describes one policy key as an ODRL-AP-NL document.
        Policies stored as language "odrl" are re-served from their imported source.
      tags:
        - odrl
      responses:
        "200":
          description: ODRL-AP-NL export of the policy.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /odrl/import:
    post:
      operationId: "odrl-import"
      summary: Import an ODRL-AP-NL document.
      description: |
        Imports an ODRL-AP-NL document. The request body is the document itself
        (text/turtle or application/ld+json) or a JSON reference {"url": "..."}.
        Each policy is validated on the mandatory AP-NL base elements (uid,
        title, publisher, profile) and stored under the "odrl" policy language,
        idempotent on odrl:uid. Referenced apnl:PolicyArtifacts with a known
        executable media type are downloaded, verified against their
        apnl:sha256 and stored under their own policy language.
      tags:
        - odrl
      requestBody:
        description: The ODRL document or a reference to it.
        content:
          text/turtle:
            schema:
              type: string
          application/ld+json:
            schema:
              type: object
          application/json:
            schema:
              $ref: "#/components/schemas/OdrlImportReference"
      responses:
        "200":
          description: Import processed.
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdrlImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          description: Unsupported media type.
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /odrl/events:
    post:
      operationId: "odrl-events"
      summary: Receive a policy change as a CloudEvents 1.0 event.
      description: |
        Near-real-time ingest: accepts a CloudEvents 1.0 event (structured mode
        application/cloudevents+json, or binary mode with ce-* headers) whose
        data is an ODRL-AP-NL document (datacontenttype text/turtle or
        application/ld+json) or a JSON reference {"url": "..."}. Delivery is
        idempotent on the (source, id) tuple. Event type is typically
        nl.overheid.ftv.policy.updated with a "dataversion" extension holding
        the sha256 of the payload.
      tags:
        - odrl
      requestBody:
        description: The CloudEvents envelope or event data (binary mode).
        content:
          application/cloudevents+json:
            schema:
              type: object
          text/turtle:
            schema:
              type: string
          application/ld+json:
            schema:
              type: object
      responses:
        "200":
          description: Event processed (or recognized as duplicate).
          headers:
            API-Version:
              schema:
                type: string
              description: Full version number of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdrlImportResult"
        "202":
          description: Event acknowledged without content to import.
        "400":
          $ref: "#/components/responses/BadRequest"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    PolicyLanguage:
      in: path
      name: language
      schema:
        type: string
      required: true
      description: Language of a policy.

    PolicyID:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: Unique identifier of a policy.

    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.

    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.

  responses:
    BadRequest:
      description: Bad request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotAuthorized:
      description: Not authorized.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AccessDenied:
      description: Access denied.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AlreadyExists:
      description: Resource already exists.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnexpectedError:
      description: Unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Policy:
      type: object
      description: The content of a policy.
      properties:
        id:
          type: string
          description: The unique identifier of the policy.
        language:
          type: string
          description: The language of the policy.
          example: "rego"
        rvvaId:
          type: string
          description: The unique identifier of the Register van Verwerkings-Activiteiten (RvVA).
        url:
          type: string
          description: Link to the actual policy.
      required:
        - id
        - language
        - url

    PoliciesResponse:
      type: array
      items:
        $ref: "#/components/schemas/Policy"

    PolicyResponse:
      $ref: "#/components/schemas/Policy"

    OdrlImportReference:
      type: object
      description: Reference to an ODRL document to import.
      properties:
        url:
          type: string
          format: uri
          description: Location of the ODRL document (text/turtle or application/ld+json).
      required:
        - url

    OdrlImportResult:
      type: object
      description: The result of an ODRL import.
      properties:
        policies:
          type: array
          description: PAP keys of the stored ODRL policies (odrl/...).
          items:
            type: string
        artifacts:
          type: array
          description: PAP keys of downloaded and verified policy artifacts.
          items:
            type: string
        warnings:
          type: array
          description: Non-fatal issues, e.g. artifacts that failed hash verification.
          items:
            type: string

    ErrorResponse:
      type: object
      description: The response for an error (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
