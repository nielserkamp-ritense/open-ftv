openapi: 3.0.0

info:
  description: |
    OpenAPI specification for maintaining policies.
  version: 1.5.0
  title: Policy management
  contact:
    name: G. Juijn
    url: https://gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv

servers:
  - url: https://localhost:8080/v1
    description: Local server.

tags:
  - name: language
    description: Operations on policy languages.
  - name: tag
    description: Operations on tags.
  - name: policy
    description: Operations on policies.

paths:
  /languages:
    get:
      operationId: "get-languages"
      summary: Retrieve languages.
      description: Endpoint to retrieve the list of supported policy languages.
      tags:
        - language
      responses:
        "200":
          $ref: "#/components/responses/LanguagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /tags:
    get:
      operationId: "get-tags"
      summary: Retrieve tags.
      description: Endpoint to retrieve the list of tags.
      tags:
        - tag
      responses:
        "200":
          $ref: "#/components/responses/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policies:
    get:
      operationId: "get-policies"
      summary: Retrieve policies.
      description: Endpoint to retrieve all policy keys.
      tags:
        - policy
      responses:
        "200":
          $ref: "#/components/responses/PoliciesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

  /policy/{language}/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyLanguage"
      - $ref: "#/components/parameters/PolicyID"

    get:
      operationId: "get-policy"
      summary: Retrieve policy.
      description: Retrieve a specified cached policy.
      tags:
        - policy
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    post:
      operationId: "create-policy"
      summary: Add policy.
      description: |
        If the unique identifier of the policy already exists, a 409 status code will be returned.        
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "201":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    put:
      operationId: "update-policy"
      summary: Replace policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/ForceUpsert"
      requestBody:
        description: Definition of the new policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: "delete-policy"
      summary: Remove policy.
      description: |
        If the unique identifier of the policy does not exist, a 404 status code will be returned.
        You can override this behavior by passing the 'force' parameter in the query.
      tags:
        - policy
      parameters:
        - $ref: "#/components/parameters/IgnoreMissing"
      responses:
        "200":
          $ref: "#/components/responses/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "5XX":
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    PolicyLanguage:
      in: path
      name: language
      schema:
        type: string
      required: true
      description: Language of a policy.

    PolicyID:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: Unique identifier of a policy.

    ForceUpsert:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Force upsert during a put/post operation.

    IgnoreMissing:
      in: query
      name: force
      schema:
        type: boolean
      required: false
      description: Ignore missing data during a delete operation.

  responses:
    LanguagesResponse:
      description: Languages found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Languages"

    TagsResponse:
      description: Tags found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tags"

    PoliciesResponse:
      description: Policies found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Policies"

    PolicyResponse:
      description: Policy found, created, replaced or removed.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Policy"

    BadRequest:
      description: Bad request.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotAuthorized:
      description: Not authorized.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AccessDenied:
      description: Access denied.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AlreadyExists:
      description: Resource already exists.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnexpectedError:
      description: Unexpected error.
      headers:
        API-Version:
          schema:
            type: string
          description: Full version number of the API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Metadata:
      type: object
      description: The metadata associated with a policy.
      properties:
        title:
          type: string
          description: The title of the policy. E.g., a short description.
        description:
          type: string
          description: Detailed description of the policy.
        rvvaId:
          type: string
          description: |
            The unique identifier of the Register van Verwerkings-Activiteiten (RvVA).
            Only required when the policy is linked directly with an item in the RvVA.
            The value is considered as one of the tags of the policy.
        url:
          type: string
          description: Link to the policy. Required when the policy is stored externally.
        tags:
          type: array
          description: |
            List of tags the policy is annotated with.
            
            This is used to determine which PDP (or set of PDPs) objects can be pushed to.
          items:
            type: string
        createDate:
          type: string
          description: Timestamp the policy was created (RFC3339 format).
        createUser:
          type: string
          description: User that created the policy.
        updateDate:
          type: string
          description: Timestamp the policy was last updated (RFC3339 format).
        updateUser:
          type: string
          description: User that last updated the policy.

    UsageData:
      type: object
      description: Metadata about how and where the policy is used.
      properties:
        bundles:
          type: array
          description: Bundles the policy is used by.
          items:
            type: string

    AuditEntry:
      type: object
      description: Metadata about how, when and by whom an object has been manipulated.
      properties:
        timestamp:
          type: string
          description: Timestamp of the log entry in RFC3339 format.
        operation:
          type: string
          description: Operation performed on the object. Any of ["CREATE", "UPDATE", "DELETE"].
        user:
          type: string
          description: Unique identifier of the user who operated on the object.

    Languages:
      type: array
      items:
        $ref: "#/components/schemas/Language"

    Language:
      type: object
      description: The details of a policy language.
      properties:
        id:
          type: string
          description: The unique identifier of the policy language.
        name:
          type: string
          description: Name of the policy language in human-readable form.

    Tags:
      type: array
      items:
        $ref: "#/components/schemas/Tag"

    Tag:
      type: object
      description: The details of a tag.
      properties:
        id:
          type: string
          description: The unique identifier of the tag.
        name:
          type: string
          description: Name of the tag in human-readable form.
        description:
          type: string
          description: Detailed description of the tag.
        createDate:
          type: string
          description: Timestamp the tag was created (RFC3339 format).
        createUser:
          type: string
          description: User that created the tag.
        updateDate:
          type: string
          description: Timestamp the tag was last updated (RFC3339 format).
        updateUser:
          type: string
          description: User that last updated the tag.
        auditLog:
          type: array
          description: Audit log for the tag.
          items:
            $ref: "#/components/schemas/AuditEntry"

    Policies:
      type: array
      items:
        $ref: "#/components/schemas/Policy"

    Policy:
      type: object
      description: The content of a policy.
      properties:
        id:
          type: string
          description: The unique identifier of the policy.
        language:
          type: string
          description: |
            The language of the policy.
            The value is case-insensitive.
            The value is considered as one of the tags of the policy.
            
            Supported values:
            - "opa/rego"; alternatives: "opa", "rego", "opa-rego".
            - "cedar".
            - "cerbos/cel"; alternatives: "cerbos", "cel", "cerbos-cel". 
            - "openfga"; alternative: "open-fga".
        data:
          type: string
          description: Content of the policy. Required when the policy is stored internally.
        metadata:
          $ref: "#/components/schemas/Metadata"
        usageData:
          $ref: "#/components/schemas/UsageData"
        auditLog:
          type: array
          description: Audit log for the policy.
          items:
            $ref: "#/components/schemas/AuditEntry"
      required:
        - id
        - language

    Error:
      type: object
      description: The response for an error (as defined by RFC9457).
      properties:
        type:
          type: string
          format: uri
          description: Identification of the problem.
        status:
          type: integer
          description: Status code of the problem.
        title:
          type: string
          description: Summary of the problem.
        detail:
          type: string
          description: Detailed description of the problem.
        instance:
          type: string
          format: uri
          description: Identification of the problem instance.
