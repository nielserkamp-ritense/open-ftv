apps/manager/**/*.go eam/**.*.go !**/*_test.go {
  daemon +sigterm: "
      # Manager
      dlv debug --headless -l 127.0.0.1:17500 --api-version=2 --continue --accept-multiclient --output ./.debugger/manager.bin \
        ./apps/manager/cmd -- \
        --database-url postgres://user:password\@localhost:5432/openftv?sslmode=disable \
        --adl-pg-url postgres://user:password\@localhost:5432/openftv_adl?sslmode=disable \
        --log-format text \
        --log-level info
      "
}
