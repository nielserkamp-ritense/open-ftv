# This is the local setup of the Proefopstelling using the
# Laadpalen-application. Organizations involved:
# - Gemeente Vlierdam
# - RvIG
# - RDW

###
# Gemeente Vlierdam
###
apps/manager/**/*.go eam/**/*.go !**/*_test.go {
  daemon +sigterm: "
      # [Gemeente Vlierdam] Manager
      MANAGER_OIDC_ISSUER=http://localhost:8088/realms/openftv \
      MANAGER_OIDC_JWKS_URL=http://localhost:8088/realms/openftv/protocol/openid-connect/certs \
      dlv debug --headless -l 127.0.0.1:17000 --api-version=2 --continue --accept-multiclient --output ./.debugger/manager.bin \
        ./apps/manager/cmd -- \
        --port 9000 \
        --internal-port 9100 \
        --health-port 8081 \
        --database-url postgres://postgres:postgres\@localhost:5432/openftv_vlierdam_manager?sslmode=disable \
        --adl-pg-url postgres://postgres:postgres\@localhost:5432/openftv_vlierdam_adl?sslmode=disable \
        --policies-language cedar \
        --policies-store ./testdata/apps/gemeente-vlierdam/manager/policies \
        --policies-store-recurse \
        --pip-store ./testdata/apps/gemeente-vlierdam/manager/data \
        --pip-store-recurse \
        --tags-path ./testdata/apps/gemeente-vlierdam/manager/tags \
        --bundle-configs ./testdata/apps/gemeente-vlierdam/manager/bundles \
        --bundle-recurse \
        --bundle-send-timeout 60s \
        --authentication-type none \
        --log-format console \
        --log-level info
      "
}

{
   indir: apps/management-interface
   daemon +sigterm: "
       # [Gemeente Vlierdam] Policy Editor
       npm run dev
   "
}

apps/pdp/**/*.go eam/**/*.go !**/*_test.go {
  daemon +sigterm: "
      # [Gemeente Vlierdam] PDP
      dlv debug --headless -l 127.0.0.1:17100 --api-version=2 --continue --accept-multiclient --output ./.debugger/pdp.bin \
        ./apps/pdp/cmd -- \
        --port 9004 \
        --internal-port 9104 \
        --health-port 8082 \
        --adl-service-name vlierdam \
        --adl-pg-url postgres://postgres:postgres\@localhost:5432/openftv_vlierdam_adl?sslmode=disable \
        --policies-language cedar \
        --pip-store ./testdata/apps/gemeente-vlierdam/pdp1/data \
        --pip-store-recurse \
        --pip-pull-configs ./testdata/apps/gemeente-vlierdam/pdp1/pull-config/config.yaml \
        --bundle-manager http://localhost:9100/v1/bundle/pdp1 \
        --bundle-encoding bzip2 \
        --bundle-timeout 30s \
        --bundle-retries 5 \
        --log-format console \
        --log-level info
      "
}

apps/pdp/**/*.go eam/**/*.go !**/*_test.go {
  daemon +sigterm: "
      # [Gemeente Vlierdam] PDP2
      dlv debug --headless -l 127.0.0.1:17900 --api-version=2 --continue --accept-multiclient --output ./.debugger/vlierdam-pdp2.bin \
        ./apps/pdp/cmd -- \
        --port 9005 \
        --internal-port 9105 \
        --health-port 8087 \
        --adl-service-name vlierdam \
        --adl-pg-url postgres://postgres:postgres\@localhost:5432/openftv_vlierdam_adl?sslmode=disable \
        --policies-language rego \
        --pip-pull-configs ./testdata/apps/gemeente-vlierdam/pdp2/pull-config/config.yaml \
        --bundle-manager http://localhost:9100/v1/bundle/pdp2 \
        --bundle-encoding gzip \
        --bundle-timeout 30s \
        --bundle-retries 5 \
        --log-format console \
        --log-level info
      "
}

mock/datasources/generic/**/*.go !**/*_test.go {
  daemon +sigterm: "
      # [Gemeente Vlierdam] Gemeentelijke registraties
      dlv debug --headless -l 127.0.0.1:17200 --api-version=2 --continue --accept-multiclient --output ./.debugger/gemeente-vlierdam-dataspace.bin \
        ./mock/datasources/generic/cmd -- \
          --port 9010 \
          --data-path ./mock/datasources/dataspaces/vlierdam \
          --log-format console \
          --log-level info
      "
}

{
   indir: apps/laadpalen-applicatie
   daemon +sigterm: "
       # [Gemeente Vlierdam] Zaaksysteem
       npm run dev
   "
}

