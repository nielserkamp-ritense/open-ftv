Lint OpenAPI specs:
  stage: Tests
  image:
    name: stoplight/spectral:latest
    entrypoint: [""]
  script:
    - cd oas
    - spectral lint -r .spectral.yml authzen/openapi.yaml
    - spectral lint -r .spectral.yml policies/openapi.yaml
    - spectral lint -r .spectral.yml attributes/openapi.yaml
    - spectral lint -r .spectral.yml authlog/openapi.yaml
    - spectral lint -r .spectral.yml bundles/openapi.yaml
    - spectral lint -r .spectral.yml schema/openapi.yaml
    - cd -
  needs: []

Lint Golang:
  stage: Tests
  image: golangci/golangci-lint:v2.12.2-alpine
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go-cache
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/.golangci-cache
    GIT_DEPTH: 0
  before_script:
    - export PATH=$PATH:/usr/local/go/bin
    - apk --no-cache add jq
    - mkdir -p .go-cache .golangci-cache
  needs: []
  script:
    - golangci-lint run --new-from-merge-base=origin/main --output.text.path stdout --output.code-climate.path=gl-code-quality-report.json
  cache:
    key: golangci-lint-cache
    paths:
      - .go-cache
      - .golangci-cache
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

Lint Helm charts:
  stage: Tests
  image:
    name: docker.io/alpine/helm:4.2.3@sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b
    entrypoint: [""]
  needs: []
  before_script:
    - apk --no-cache add yq kustomize
  script:
    - helm dependency update deploy/charts/open-ftv
    - yq 'select(.kind == "HelmRelease") | .spec.values' deploy/kustomize/simulation/open-ftv.yaml > simulation-values.yaml
    - helm lint deploy/charts/*
    - helm template open-ftv deploy/charts/open-ftv
    # Check the chart against the values the Simulatieomgeving actually deploys.
    - helm lint deploy/charts/open-ftv --values simulation-values.yaml
    - helm template open-ftv deploy/charts/open-ftv --values simulation-values.yaml
    - kustomize build deploy/kustomize/simulation
