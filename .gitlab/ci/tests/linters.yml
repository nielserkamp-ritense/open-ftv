openapi:
  stage: Linter
  image:
    name: stoplight/spectral:latest
    entrypoint: [""]
  script:
    - cd oas
    - spectral lint -r .spectral.yml authzen/openapi.yaml
    - spectral lint -r .spectral.yml policies/openapi.yaml
    - spectral lint -r .spectral.yml attributes/openapi.yaml
    - cd -
  needs: [ ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: "main"
        paths:
          - oas/**/*
          - \.gitlab/ci/tests/linters.yml
          - \.golang-ci.yml
    - if: $CI_PROJECT_PATH != "digilab.overheid.nl/ecosystem/ftv/open-ftv" && $CI_PIPELINE_SOURCE == "merge_request_event" # run for external fork merge requests
  artifacts:
    expire_in: 2 weeks
