Lint OpenAPI specs:
  stage: Tests
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/stoplight/spectral:latest
    entrypoint: [""]
  script:
    - cd oas
    - spectral lint -r .spectral.yml authzen/openapi.yaml
    - spectral lint -r .spectral.yml policies/openapi.yaml
    - spectral lint -r .spectral.yml attributes/openapi.yaml
    - spectral lint -r .spectral.yml authlog/openapi.yaml
    - spectral lint -r .spectral.yml bundles/openapi.yaml
    - spectral lint -r .spectral.yml schema/openapi.yaml
    - cd -
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

Lint Golang:
  stage: Tests
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golangci/golangci-lint:v2.12.2-alpine
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go-cache
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/.golangci-cache
    GIT_DEPTH: 0
  before_script:
    - export PATH=$PATH:/usr/local/go/bin
    - apk --no-cache add jq
    - mkdir -p .go-cache .golangci-cache
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - golangci-lint run --new-from-merge-base=origin/main --output.text.path stdout --output.code-climate.path=gl-code-quality-report.json
  cache:
    key: golangci-lint-cache
    paths:
      - .go-cache
      - .golangci-cache
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

Lint Helm charts:
  stage: Tests
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/alpine/helm:4.2.3@sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  before_script:
    - apk --no-cache add yq kustomize
  script:
    - helm dependency update deploy/charts/open-ftv
    - helm lint deploy/charts/*
    - helm template open-ftv deploy/charts/open-ftv
    # An overlay holds several HelmReleases, each on the chart its OCIRepository points at. The
    # pre-release overlay reads the demo config from demo/, outside the overlay.
    - |-
      for OVERLAY in deploy/kustomize/*/; do
        OVERLAY="${OVERLAY%/}"
        echo "checking ${OVERLAY}"
        kustomize build --load-restrictor LoadRestrictionsNone "${OVERLAY}" > overlay.yaml
        for RELEASE in $(yq --no-doc 'select(.kind == "HelmRelease") | .metadata.name' overlay.yaml); do
          export RELEASE
          SOURCE=$(yq 'select(.kind == "HelmRelease" and .metadata.name == strenv(RELEASE)) | .spec.chartRef.name' overlay.yaml)
          export SOURCE
          URL=$(yq 'select(.kind == "OCIRepository" and .metadata.name == strenv(SOURCE)) | .spec.url' overlay.yaml)
          CHART="deploy/charts/${URL##*/}"
          echo "checking ${OVERLAY}: ${RELEASE} (${CHART})"
          yq 'select(.kind == "HelmRelease" and .metadata.name == strenv(RELEASE)) | .spec.values' overlay.yaml > overlay-values.yaml
          helm lint "${CHART}" --values overlay-values.yaml
          helm template "${RELEASE}" "${CHART}" --values overlay-values.yaml
        done
      done

Lint commit messages:
  stage: Tests
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/commitlint/commitlint:21.2.3@sha256:33f225c84111a38ebac0c81fa21c488a79709b8a8e04056dfaaf4f80ef20be25
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  needs: []
  script:
    - commitlint --from origin/main --to HEAD --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
