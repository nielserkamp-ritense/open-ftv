include:
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: Security
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Without go.graph the dependency scanner only reads go.mod and loses the dependency paths.
go_mod_graph:
  stage: Security
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.26.7-alpine # matches go.mod
  script:
    - go mod graph > go.graph
  needs: []
  allow_failure: true
  artifacts:
    expire_in: 1 day
    paths:
      - go.graph
  # The same rules as the dependency-scanning template: the license approval policy reads the merge request's
  # latest pipeline, so with an open merge request the scan runs there instead of in the branch pipeline.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

dependency-scanning:
  needs:
    - go_mod_graph

secret_detection:
  stage: Security
  needs: []
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: "modd.conf, testdata, **/*_test.go, **/README.md"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
