# The scanners below feed the GitLab vulnerability report and run in the daily scheduled pipeline on the
# default branch: the report only tracks default-branch results, and new advisories appear without code changes.
# Dependency scanning also runs on branches: the license approval policy compares a branch's licenses to main's.
include:
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: Security
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Without go.graph the dependency scanner only reads go.mod and loses the dependency paths.
go_mod_graph:
  stage: Security
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.26.7-alpine # matches go.mod
  script:
    - go mod graph > go.graph
  needs: []
  artifacts:
    expire_in: 1 day
    paths:
      - go.graph
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

dependency-scanning:
  needs:
    - go_mod_graph
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

secret_detection:
  stage: Security
  needs: []
  variables:
    # Local dev credentials, documentation examples and test fixtures, not real secrets.
    SECRET_DETECTION_EXCLUDED_PATHS: "modd.conf, testdata, **/*_test.go, **/README.md"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
