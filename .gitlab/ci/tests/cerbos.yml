cerbos:
  stage: CerbosUnitTests
  image: golang:1.23.8-alpine@sha256:b7486658b87d34ecf95125e5b97e8dfe86c21f712aa36fc0c702e5dc41dc63e1
  parallel:
    matrix:
      - MODULE:
          - cerbos-api
  services:
    - name:  ghcr.io/cerbos/cerbos:0.43.0
      alias: cerbos
      command:
        - "server"
        - "--set=storage.driver=sqlite3"
        - "--set=storage.sqlite3.dsn=file::memory:?cache=shared"
        - "--set=server.adminAPI.enabled=true"
        - "--set=server.adminAPI.adminCredentials.username=cerbos"
        - "--set=server.adminAPI.adminCredentials.passwordHash=JDJ5JDEwJElmZ0hMTlE4RThvTEpYQTRxNFJDLi5YYkdiU0pzV0xjQ3JEWFBSb2gwaFhYTHBDa3cyMFRPCgo="
  variables:
    CERBOS_ADDRESS: "cerbos:3593"
    GOPATH: ${CI_PROJECT_DIR}/eam/pdp/${MODULE}/.go-cache
  before_script:
    - mkdir -p eam/pdp/${MODULE}/.go-cache
  script:
    - cd eam/pdp/${MODULE}
    - /usr/local/go/bin/go mod download
    - /usr/local/go/bin/go test ./... -covermode=atomic  -coverprofile cover.out
    - /usr/local/go/bin/go tool cover -html=cover.out -o cover.html
    - /usr/local/go/bin/go tool cover -func=cover.out
    - cd -
  coverage: /total:\t+\(statements\)\t+([\d\.]+?%)/
  cache:
    key: OpenFTV-Cerbos-UnitTests
    paths:
      - eam/pdp/${MODULE}/.go-cache
  artifacts:
    expire_in: 2 weeks
    paths:
      - eam/pdp/${MODULE}/cover.html
  needs:
    - job: base
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: "main"
        paths:
          - utilities/**/*
          - utilities-no-ci/**/*
          - oas/**/*
          - testdata/**/*
          - eam/**/*
          - .gitlab/ci/tests/cerbos.yml
          - .golang-ci.yml
    - if: $CI_PROJECT_PATH != "digilab.overheid.nl/ecosystem/ftv/ftv-implementatie" && $CI_PIPELINE_SOURCE == "merge_request_event" # run for external fork merge requests
