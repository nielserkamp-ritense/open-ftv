unit-tests:
  stage: UnitTests
  image: golang:1.26.5-alpine
  services:
    - name:  ghcr.io/cerbos/cerbos:0.46.0
      alias: cerbos
      command:
        - "server"
        - "--set=storage.driver=sqlite3"
        - "--set=storage.sqlite3.dsn=file::memory:?cache=shared"
        - "--set=server.adminAPI.enabled=true"
        - "--set=server.adminAPI.adminCredentials.username=cerbos"
        - "--set=server.adminAPI.adminCredentials.passwordHash=JDJ5JDEwJElmZ0hMTlE4RThvTEpYQTRxNFJDLi5YYkdiU0pzV0xjQ3JEWFBSb2gwaFhYTHBDa3cyMFRPCgo="
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go-cache
    CERBOS_ADDRESS: "cerbos:3593"
  before_script:
    - mkdir -p .go-cache
  script:
    - >
      /usr/local/go/bin/go test
      ./utilities/./...
      ./eam/models/./...
      ./eam/config/./...
      ./eam/log/./...
      ./eam/authentication/./...
      ./eam/authorization/./...
      ./eam/mapping/./...
      ./eam/mimetype/./...
      ./eam/bundles/./...
      ./eam/handlers/./...
      ./eam/server/./...
      ./eam/pip/./...
      ./eam/pap/./...
      ./eam/pep/./...
      ./eam/pdp/controller/./...
      ./eam/pdp/cedar-embedded/./...
      ./eam/pdp/opa-embedded/./...
      ./eam/pdp/openfga-embedded/./...
      ./eam/pdp/cerbos-api/./...
      ./mock/datasources/data/./...
      ./apps/pip/./...
      ./apps/pap/./...
      ./apps/pdp/./...
      ./apps/manager/./...
      -covermode=atomic
      -coverprofile cover.out

      /usr/local/go/bin/go tool cover -html=cover.out -o cover.html

      /usr/local/go/bin/go tool cover -func=cover.out
  coverage: /total:\t+\(statements\)\t+([\d\.]+?%)/
  cache:
    key: OpenFTV-UnitTests
    paths:
      - .go-cache
  artifacts:
    expire_in: 2 weeks
    paths:
      - cover.html
  needs: []
  resource_group: unit-tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: $CI_DEFAULT_BRANCH
        paths:
          - utilities/**/*
          - utilities-no-ci/**/*
          - oas/**/*
          - testdata/**/*
          - eam/**/*
          - mock/datasources/data/**/*
          - apps/**/*
          - \.gitlab/ci/tests/unittests.yml
          - \.golang-ci.yml
    - if: $CI_PROJECT_PATH != "digilab.overheid.nl/ecosystem/ftv/open-ftv" && $CI_PIPELINE_SOURCE == "merge_request_event" # run for external fork merge requests
