build_release_eam:
  stage: Release
  image: quay.io/buildah/stable:v1.44.0
  parallel:
    matrix:
      - ARCH:
          - amd64
          - arm64
        APP:
          - pip
          - pap
          - pdp
          - manager
          - management-interface
  before_script:
    - export SEMVER="${CI_COMMIT_TAG:1}"
    - echo "container tag=${SEMVER}"
    - echo -n "${CI_REGISTRY_IMAGE}" > ci_build_image_registry.txt
    - echo -n "${SEMVER}" > ci_build_image_tag.txt
  script:
    - buildah build
      --platform=linux/${ARCH}
      --build-arg GIT_COMMIT_HASH=${CI_COMMIT_SHA}
      --build-arg GIT_TAG_NAME=${CI_COMMIT_TAG}
      -f=apps/${APP}/Dockerfile
      -t eam/${APP}:${SEMVER}-${ARCH}
      .
    - buildah push eam/${APP}:${SEMVER}-${ARCH} oci-archive:eam-${APP}-${ARCH}.tar
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
  artifacts:
    paths:
      - ci_build_image_registry.txt
      - ci_build_image_tag.txt
      - eam-${APP}-${ARCH}.tar
  resource_group: build_release_eam
  tags:
    - ${ARCH}

