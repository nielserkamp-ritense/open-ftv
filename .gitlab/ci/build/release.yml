build_release_ko:
  extends: .build_ko
  script:
    - printf '%s' "${CI_REGISTRY_PASSWORD}" | ko login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
    - export GIT_TAG_NAME=${IMAGE_TAG}
    - ko build --bare --sbom=none --tags ${IMAGE_TAG},latest ${MAIN}
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
