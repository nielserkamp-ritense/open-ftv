.build_ko:
  stage: Build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.26.7-alpine
  variables:
    # renovate: datasource=go depName=github.com/google/ko
    KO_VERSION: "v0.19.1"
    GOMODCACHE: ${CI_PROJECT_DIR}/.go-cache/mod
    GOCACHE: ${CI_PROJECT_DIR}/.go-cache/build
  parallel:
    matrix:
      - APP: pip
        MAIN: ./apps/pip/cmd
      - APP: pap
        MAIN: ./apps/pap/cmd
      - APP: pdp
        MAIN: ./apps/pdp/cmd
      - APP: manager
        MAIN: ./apps/manager/cmd
      - APP: management-interface
        MAIN: ./apps/management-interface/cmd
      - APP: laadpalen-applicatie
        MAIN: ./apps/laadpalen-applicatie/cmd
      - APP: mock-ds-generic
        MAIN: ./mock/datasources/generic/cmd
      - APP: mock-ds-vlierdam
        MAIN: ./mock/datasources/generic/cmd/vlierdam
      - APP: mock-ds-rvig
        MAIN: ./mock/datasources/generic/cmd/rvig
      - APP: mock-ds-rdw
        MAIN: ./mock/datasources/generic/cmd/rdw
      - APP: pep-kong
        MAIN: ./apps/pep-kong/cmd/openftv
  before_script:
    - go install github.com/google/ko@${KO_VERSION}
    - printf '%s' "${CI_DEPENDENCY_PROXY_PASSWORD}" | ko login ${CI_DEPENDENCY_PROXY_SERVER} -u ${CI_DEPENDENCY_PROXY_USER} --password-stdin
    - export KO_CONFIG_PATH=${CI_PROJECT_DIR}/.ko-ci.yaml
    - 'sed -E "s#: ([^ ]+@sha256:)#: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/\1#" .ko.yaml > ${KO_CONFIG_PATH}'
    - export KO_DOCKER_REPO=${CI_REGISTRY_IMAGE}/${APP} GIT_COMMIT_HASH=${CI_COMMIT_SHA}
  cache:
    key:
      prefix: ko
      files:
        - go.sum
    paths:
      - .go-cache
  tags:
    - amd64
