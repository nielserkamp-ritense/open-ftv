publish_production_eam:
  stage: Publish
  image: quay.io/buildah/stable:v1.43.1
  parallel:
    matrix:
      - IMAGE:
          - pip
          - pap
          - pdp
          - manager
          - management-interface
  needs:
    - job: build_production_eam
      artifacts: true
  before_script:
    - export SEMVER="${CI_COMMIT_TAG:1}"
    - echo "container tag=${SEMVER}"
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - TARGET="${CI_REGISTRY_IMAGE}/eam/${IMAGE}"
    - buildah manifest create "${TARGET}:${SEMVER}"
    - |
      found=0
      for tar in eam-${IMAGE}-*.tar; do
        [ -e "$tar" ] || continue
        echo "Adding architecture archive: $tar"
        buildah manifest add "${TARGET}:${SEMVER}" "oci-archive:$tar"
        found=1
      done
      if [ "$found" -eq 0 ]; then
        echo "ERROR: no image archives matched eam-${IMAGE}-*.tar" >&2
        exit 1
      fi
    - buildah manifest push --all "${TARGET}:${SEMVER}" "docker://${TARGET}:${SEMVER}"
    - buildah manifest push --all "${TARGET}:${SEMVER}" "docker://${TARGET}:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"'
  tags:
    - saas-linux-small-amd64

