Pre-release images:
  extends: .build_ko
  script:
    - printf '%s' "${CI_REGISTRY_PASSWORD}" | ko login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
    - export GIT_TAG_NAME=${IMAGE_TAG}
    - ko build --bare --sbom=none --tags ${IMAGE_TAG} ${MAIN}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
