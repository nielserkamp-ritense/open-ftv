assets_management_interface:
  stage: Assets
  image: node:22.17.1-alpine
  before_script:
    - cd apps/management-interface
  script:
    - npm ci --prefer-offline --cache .npm
    - npm run build
  cache:
    key:
      prefix: npm
      files:
        - apps/management-interface/package-lock.json
    paths:
      - apps/management-interface/.npm
  artifacts:
    expire_in: 1 day
    paths:
      - apps/management-interface/web/dist/
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
  tags:
    - amd64
