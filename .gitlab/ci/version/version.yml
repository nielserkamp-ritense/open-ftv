variables:
  GIT_DEPTH: 0

next-version:
  stage: Version
  image: alpine:3.22
  script:
    - apk --no-cache add git bash
    - export CURRENT_SEMVER=$(git describe --tags --abbrev=0)
    - echo ${CURRENT_SEMVER}
    - export NEXT_SEMVER=$(${CI_PROJECT_DIR}/semver.sh -m ${CURRENT_SEMVER})
    - echo ${NEXT_SEMVER}
    - echo ${NEXT_SEMVER} > ci_semantic_release_next_version.txt
  artifacts:
    expire_in: 2 weeks
    paths:
      - ci_semantic_release_next_version.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: $CI_DEFAULT_BRANCH
        # Must stay a superset of every build_review_* job's changes rules in
        # builds/review.yml: those jobs need this one (needs: optional: false),
        # so a change that triggers a build but not this job breaks the pipeline.
        paths:
          - go.mod
          - go.sum
          - \.dockerignore
          - "**/*.go"
          - apps/**/*
          - eam/**/*
          - external/**/*
          - migrations/**/*
          - mock/**/*
          - oas/**/*
          - testdata/**/*
          - utilities/**/*
          - utilities-no-ci/**/*
          - \.gitlab/ci/version/version.yml
          - \.gitlab/ci/builds/review.yml
          - semver.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
    - if: $CI_PROJECT_PATH != "digilab.overheid.nl/ecosystem/ftv/open-ftv" && $CI_PIPELINE_SOURCE == "merge_request_event" # run for external fork merge requests
