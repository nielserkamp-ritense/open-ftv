manifest-release-eam:
  stage: Manifest
  image:
    name: mplatform/manifest-tool:alpine
    entrypoint: [""]
  parallel:
    matrix:
      - IMAGE:
          - pip
          - pap
          - pdp
          - manager
          - management-interface
  before_script:
    - export SEMVER="${CI_COMMIT_TAG:1}"
    - echo "container tag=${SEMVER}"
  script:
    - manifest-tool
      --username=${DOCKERHUB_USERNAME}
      --password=${DOCKERHUB_PASSWORD}
      push from-args
      --platforms linux/amd64,linux/arm64
      --template ${CI_REGISTRY_IMAGE}/eam/${IMAGE}:${SEMVER}-ARCH
      --target ${CI_REGISTRY_IMAGE}/eam/${IMAGE}:${SEMVER}
      --tags latest
  rules:
    - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"'

