manifest-testing:
  stage: Manifest
  image:
    name: mplatform/manifest-tool:alpine-v2.2.2@sha256:566f66687564e125c43bb86e2d035ad9b7fb4449f38814535b691d1a7f8d20db
    entrypoint: [""]
  parallel:
    matrix:
      - IMAGE:
          - pdp
          - manager
          - management-interface
          - mock-ds-generic
          - gw-plugin-envoy
  script:
    - manifest-tool
      --username=${CI_REGISTRY_USER}
      --password=${CI_REGISTRY_PASSWORD}
      push from-args
      --platforms linux/amd64
      --template ${CI_REGISTRY_IMAGE}/${IMAGE}:${IMAGE_TAG}-ARCH
      --target ${CI_REGISTRY_IMAGE}/${IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "digilab.overheid.nl/ecosystem/ftv/open-ftv"
